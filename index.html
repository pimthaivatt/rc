@media (prefers-reduced-motion:reduce){#ph>.reveal{display:none!important}#ph>.spl-main,#ph>.spl-dots{animation:none!important;opacity:1}}
.ph.still>img,.ph.still>div>img{animation:none!important}
.ohero .oitem{opacity:0;transform:rotate(var(--r));animation:odrop .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes odrop{from{opacity:0;transform:translateY(-40px) rotate(0)}to{opacity:1;transform:rotate(var(--r))}}
.ohero .ostamp{transform:rotate(-12deg);animation:ostamp .5s cubic-bezier(.3,1.6,.5,1) 1s both}
@keyframes ostamp{from{opacity:0;transform:scale(1.8) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(-12deg)}}
.ohero .onote{clip-path:inset(0 100% 0 0);animation:write .8s steps(16,end) 1.4s forwards}
.ph.still .ohero *{animation:none!important;opacity:1;clip-path:none}
@media (prefers-reduced-motion:reduce){.ohero .oitem,.ohero .ostamp,.ohero .onote{animation:none!important;opacity:1;clip-path:none}}
@media (min-width:600px){body{padding-block:0}}
summary.acc{list-style:none;display:flex;align-items:center;gap:10px;height:58px;cursor:pointer}
summary.acc::-webkit-details-marker{display:none}
details .chev{transition:transform .2s}details[open] .chev{transform:rotate(180deg)}
details .acc-t:after{content:"see"}details[open] .acc-t:after{content:"hide"}
details[open]>summary~*{animation:accin .25s ease}@keyframes accin{from{opacity:0;transform:translateY(-4px)}}
body.bigui .hc{width:56px!important;height:56px!important}body.bigui .btn{min-height:62px}

.spl-main .draw.d2 path{animation-delay:.15s!important;animation-duration:.8s!important}
.spl-main .draw.d2 path:nth-of-type(2){animation-delay:.45s!important}
.spl-main .draw.d2 path:nth-of-type(3){animation-delay:.7s!important}

.reveal{background:#fff;cursor:pointer}
.rvh{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:#fff;padding-top:6px}
.rvh>*{flex-shrink:0}.rvh .grow{flex:1}
.dd{position:relative}
.dd>summary{list-style:none;cursor:pointer}
.dd>summary::-webkit-details-marker{display:none}
.dd .chev{transition:transform .2s}.dd[open] .chev{transform:rotate(180deg)}
.dd[open]>summary{box-shadow:inset 0 1.5px 0 #fff,0 0 0 1.6px #1E1E1F,0 10px 24px -16px rgba(30,30,31,.3)!important}
.dd-list{position:absolute;left:0;right:0;top:64px;z-index:6;border-radius:22px;padding:6px;display:flex;flex-direction:column;box-shadow:inset 0 1.5px 0 #fff,0 0 0 1px rgba(30,30,31,.08),0 18px 34px -14px rgba(30,30,31,.4)!important;animation:accin .18s ease-out both}
.dd-opt{display:flex;align-items:center;gap:14px;height:50px;padding:0 14px;border-radius:16px;cursor:pointer;border:0;background:none;font:inherit;color:inherit;width:100%}
.dd-opt.on{background:#F3F2EE}
.qopt2{display:flex;align-items:center;gap:5px;height:42px;padding:0 11px;font-size:16px;white-space:nowrap;border-radius:14px;color:#6F6C68;box-shadow:0 0 0 1px rgba(30,30,31,.14);cursor:pointer;border:0;background:none;font-family:inherit}
.qopt2.on{color:#fff;background:#1E1E1F;box-shadow:none;-webkit-text-stroke:.3px #fff}
.qrow+.qrow{margin-top:0}
.rcstamp{transform:rotate(-12deg);animation:rcstamp .45s cubic-bezier(.3,1.6,.5,1) 2.2s both}
@keyframes rcstamp{from{opacity:0;transform:rotate(-24deg) scale(1.9)}to{opacity:.86;transform:rotate(-12deg) scale(1)}}
.ph.still .rcstamp{animation-delay:-10s!important}

<script>
"use strict";
/* ===== Real courses from OpenStreetMap, drawn in design E's illustrated style ===== */
const OSM_SERVERS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
const OSM={list:null,listState:"idle",listErr:"",courses:{},loading:{}};
function osmLs(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function osmSave(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){/* storage full: keep in memory */}}
OSM.courses=osmLs("rc_osm_courses",{});
async function overpass(q){let last;
 for(const u of OSM_SERVERS){try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),45000);
   const r=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ctl.signal});clearTimeout(t);
   if(r.ok)return await r.json();last=new Error("HTTP "+r.status)}catch(e){last=e}}
 throw last||new Error("offline")}

/* --- every golf course in Thailand --- */
async function loadThaiCourses(force){
 const cached=osmLs("rc_th_courses",null);
 if(cached&&!force&&Date.now()-cached.t<7*864e5){OSM.list=cached.list;OSM.listState="ok";return}
 OSM.listState="loading";
 try{const j=await overpass('[out:json][timeout:90];area["ISO3166-1"="TH"][admin_level=2]->.th;nwr["leisure"="golf_course"](area.th);out tags center;');
  const seen=new Set();
  OSM.list=j.elements.map(e=>{const t=e.tags||{};const c=e.center||{lat:e.lat,lon:e.lon};
   const name=t["name:en"]||t["int_name"]||t.name;if(!name||!c||c.lat==null)return null;
   return{id:`osm-${e.type}-${e.id}`,type:e.type,oid:e.id,name:name.trim(),th:(t.name&&t.name!==name)?t.name:"",lat:c.lat,lon:c.lon,
    prov:t["addr:province"]||t["addr:state"]||t["is_in:province"]||t["addr:city"]||t["addr:district"]||""}})
   .filter(c=>c&&!seen.has(c.name.toLowerCase())&&seen.add(c.name.toLowerCase()))
   .sort((a,b)=>a.name.localeCompare(b.name));
  OSM.listState="ok";osmSave("rc_th_courses",{t:Date.now(),list:OSM.list});
 }catch(e){OSM.listState="error";OSM.listErr=String(e&&e.message||e)}
}

/* --- one course: holes, fairways, greens, bunkers, water, trees --- */
async function loadCourseMap(meta){
 if(OSM.loading[meta.id])return OSM.loading[meta.id];
 const p=(async()=>{
  const feats='(nwr["golf"](area.c);way["natural"~"^(wood|water|scrub|tree_row)$"](area.c);way["landuse"~"^(forest|reservoir|basin)$"](area.c);way["water"](area.c);node["natural"="tree"](area.c););out geom;';
  let j=null;
  if(meta.type!=="node"){try{j=await overpass(`[out:json][timeout:90];${meta.type==="way"?"way":"rel"}(${meta.oid});map_to_area->.c;`+feats)}catch(e){j=null}}
  if(!j||!j.elements.some(e=>e.tags&&e.tags.golf==="hole")){
   j=await overpass(`[out:json][timeout:90];(nwr["golf"](around:1600,${meta.lat},${meta.lon});way["natural"~"^(wood|water|scrub|tree_row)$"](around:1600,${meta.lat},${meta.lon});way["water"](around:1600,${meta.lat},${meta.lon});node["natural"="tree"](around:1600,${meta.lat},${meta.lon}););out geom;`)}

  dAvg:trend(a=>sum(a.map(s=>s.score))/a.length),dFw:trend(a=>sum(a.map(s=>s.fwHit))/Math.max(1,sum(a.map(s=>s.fwN)))),dGir:trend(a=>sum(a.map(s=>s.gir))/(18*a.length)),

SCR.stats=()=>{const o=overall();if(!o)return `${nav("Stats")}<div class="empty">Play a round to see your stats.</div>`;
 const last=o.st.slice(-5),ys=last.map(s=>s.score),lo=Math.floor((Math.min(...ys)-6)/10)*10,hi=Math.ceil((Math.max(...ys)+6)/10)*10;
 const x0=58,x1=348,yt=14,yb=138,Xs=last.map((_,k)=>last.length===1?(x0+x1)/2:x0+k*(x1-x0)/(last.length-1)),Y=v=>yb-(v-lo)/(hi-lo)*(yb-yt);
 const grid=[hi,(hi+lo)/2,lo].map(v=>`<path d="M${x0-16} ${Y(v).toFixed(1)} H${x1+10}" stroke="rgba(30,30,31,.07)"/><text x="6" y="${(Y(v)+5).toFixed(1)}" font-size="15" fill="#3C3A37">${v}</text>`).join("");

 const ring=(p,label,d)=>{const r=40,c=2*Math.PI*r;return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px"><span style="font-size:18px">${label}</span><span style="position:relative;width:86px;height:86px;display:block;border-radius:50%;background:#fff;box-shadow:0 10px 22px -14px rgba(30,30,31,.35)"><svg width="86" height="86" viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="40" fill="none" stroke="#E8E7E4" stroke-width="10"/><circle cx="56" cy="56" r="40" fill="none" stroke="#1E1E1F" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 56 56)"/></svg><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:23px">${Math.round(p*100)}%</span></span><span style="font-size:16px">${o.st.length>1?`${d>=0?"↑":"↓"} ${Math.abs(Math.round(d*100))}% lately`:'<span class="mute">first round</span>'}</span></div>`};
 const pr=practice(o);
 return `${nav("Stats")}${o.example?`<div class="pad" style="margin-top:-4px"><div class="mute" style="font-size:14px;text-align:center">Showing <span class="tag-ex">example</span> rounds until you save your first one</div></div>`:""}
<div class="pad row" style="gap:14px;margin-top:10px">${[["flagcup","Handicap",o.hcp.toFixed(1),""],["bars","Average Score",Math.round(o.avg),o.st.length>1?(o.dAvg<=0?"↓ ":"↑ ")+Math.abs(o.dAvg).toFixed(1)+" lately":""]].map(([i,k,v,d])=>`<div class="white" style="flex:1;height:114px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">${ic(i,24,1.4)}<span class="mute" style="font-size:15px;margin-top:2px">${k}</span><span style="font-size:34px;line-height:1">${v}</span>${d?`<span style="font-size:15px">${d}</span>`:'<span class="mute" style="font-size:13px">estimate</span>'}</div>`).join("")}</div>
<div class="pad" style="margin-top:12px"><span style="font-size:19px">Score Trend</span><svg width="100%" height="168" viewBox="0 0 360 168" style="display:block;margin-top:2px;max-width:360px" role="img" aria-label="Scores of your last rounds">${grid}<polyline points="${Xs.map((x,k)=>x.toFixed(1)+","+Y(ys[k]).toFixed(1)).join(" ")}" fill="none" stroke="#1E1E1F" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${Xs.map((x,k)=>`<circle cx="${x.toFixed(1)}" cy="${Y(ys[k]).toFixed(1)}" r="5.5" fill="#1E1E1F" stroke="#fff" stroke-width="2"/>`).join("")}${Xs.map((x,k)=>{const y=Y(ys[k]),up=y>34;return `<text x="${Math.min(352,Math.max(14,x)).toFixed(1)}" y="${(up?y-12:y+24).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1E1F" stroke="#fff" stroke-width="4" paint-order="stroke">${ys[k]}</text>`}).join("")}${Xs.map((x,k)=>`<text x="${x.toFixed(1)}" y="162" text-anchor="middle" font-size="15" fill="#3C3A37">${MONTHS[new Date(rs[k].date).getMonth()]}</text>`).join("")}</svg></div>
<div class="pad row" style="gap:12px;margin-top:4px">${ring(o.fw,"Fairway Hit %",o.dFw)}${ring(o.gir,"GIR %",o.dGir)}</div>
<div class="pad row" style="gap:0;margin-top:10px"><div style="flex:1;padding-left:6px"><div style="font-size:17px">Average Putts</div><div class="row" style="gap:12px;margin-top:6px">${ic("putter",24,1.5)}<span style="font-size:22px">${o.putts.toFixed(1)}</span></div></div><span style="width:1px;height:56px;background:var(--line)"></span><div style="flex:1;padding-left:22px"><div style="font-size:17px">Birdie Rate</div><div class="row" style="gap:12px;margin-top:6px">${ic("star",24,1.5)}<span style="font-size:22px">${Math.round(o.bird*100)}%</span></div></div></div>

let splashT=null;
function render(scrollTop){const name=cur();const fn=SCR[name]||SCR.home;let html;try{html=fn()}catch(e){console.error(e);html=SCR.home()}
 const old=document.getElementById("ph");const keep=old&&!scrollTop?old.scrollTop:0;
 const hadSheet=!!(old&&old.querySelector(".sheet"));const cls=S.dir==="arrive"?" arrive":S.dir==="still"?" still":scrollTop?(S.dir==="back"?" back":""):" still"+(hadSheet?" sheetstill":"");S.dir="";
 app.innerHTML=`<div class="ph${cls}" id="ph">${html}</div>`;const ph=document.getElementById("ph");ph.scrollTop=keep;
 clearTimeout(splashT);if(name==="splash")splashT=setTimeout(()=>{if(cur()==="splash"){S.dir="arrive";replace("home")}},6300);
 if(S.lastTog){const [ac,v]=S.lastTog.split("|");S.lastTog=null;const b=[...ph.querySelectorAll("button.toggle")].find(x=>(x.dataset.act||"")===ac&&(x.dataset.v||"")===v);if(b){const on=b.classList.contains("on");b.classList.toggle("on",!on);void b.offsetWidth;b.classList.toggle("on",on);b.classList.add("pop");setTimeout(()=>{b.classList.remove("pop")},1400)}}
 if(name==="hole")armMotion();
 if(S.round&&!S.round.done)ls.set("rc_live",S.round);
}

 if(t.tagName==="A"||t.tagName==="BUTTON"&&t.type!=="submit")e.preventDefault();
 if(t.dataset.tab){tab(t.dataset.tab);return}

 const a=t.dataset.act,v=t.dataset.v;act(a,t,v)});

 if(e.target.id==="cq"){S.params.q=e.target.value;const pos=e.target.selectionStart;reRender();const q=document.getElementById("cq");if(q){q.focus();q.setSelectionRange(pos,pos)}}
 if(e.target.id==="rdate"){S.setup.date=e.target.value}});

function act(a,t,v){const r=S.round;
 switch(a){
 case"back":back();break;
 case"home":home();break;
 case"noop":break;
 case"toast":toast(t.dataset.msg);break;
 case"gotab":tab(v);break;
 case"newround":if(S.round&&!S.round.done){S.stack=["home","hole"];S.params={};render(true)}else go("newround");break;
 case"toggleauto":S.settings.auto=!S.settings.auto;ls.set("rc_settings",S.settings);if(S.round&&!S.round.done)S.round.auto=S.settings.auto;reRender();break;
 case"opencourse":go("course",{id:t.dataset.id,pick:S.params.pick});break;
 case"retrylist":OSM.listState="loading";reRender();loadThaiCourses(true).then(()=>{if(cur()==="courses")reRender()});break;
 case"retrycourse":S.params.err=null;reRender();break;
 case"nearme":if(!navigator.geolocation){toast("Location isn't available here");break}toast("Finding courses near you…");navigator.geolocation.getCurrentPosition(p=>{S.geo={lat:p.coords.latitude,lon:p.coords.longitude};if(cur()==="courses")reRender()},()=>toast("Location is off or blocked here"),{timeout:12000,maximumAge:600000});break;
 case"playhere":S.setup.courseId=t.dataset.id;if(S.stack.includes("newround")){S.stack=S.stack.slice(0,S.stack.indexOf("newround")+1);S.params={};render(true)}else{S.stack=["home","newround"];render(true)}break;
 case"fav":S.fav[t.dataset.id]=!S.fav[t.dataset.id];ls.set("rc_fav",S.fav);reRender();break;
 case"pickmode":S.setup.mode=v;back();break;
 case"toggleplayer":{const id=t.dataset.id,p=S.setup.players;const i=p.indexOf(id);if(i>=0)p.splice(i,1);else if(p.length<4)p.push(id);else toast("Up to 4 players per group");reRender();break}
 case"startround":newRound();S.stack=["home","hole"];S.params={};render(true);break;
 case"leaveround":home();break;
 case"step":{const h=r.holes[r.cur],k=t.dataset.k,d=+t.dataset.d,par=courseById(r.courseId).pars[r.cur];if(k==="s"){if(!h.touched){h.touched=true;h.s=d>0?par:par-1;if(h.p>h.s)h.p=h.s}else{h.s=Math.max(1,Math.min(15,h.s+d));if(h.p>h.s)h.p=h.s}}else{if(!h.pt&&!h.touched){h.pt=true;h.p=d>0?1:0}else{h.pt=true;h.p=Math.max(0,h.p+d)}if(h.touched)h.p=Math.min(h.s,h.p)}h.gir=null;reRender();break}
 case"fw":{const h=r.holes[r.cur];h.fw=h.fw===v?null:v;reRender();break}
 case"gir":{const h=r.holes[r.cur];h.gir=v==="1";reRender();break}
 case"swing":logSwing(t.dataset.k,"tap");break;
 case"prevhole":if(r.cur>0){r.cur--;S.params={};S.dir="back";render(true)}break;
 case"nexthole":{const h=r.holes[r.cur];if(r.auto&&h.shots.some(s=>s.unsure&&s.counted==null)){S.params={confirm:1};reRender();break}completeHole();break}
 case"judge":{const h=r.holes[r.cur],s=h.shots[+t.dataset.k];s.counted=v==="1";recount(h);reRender();break}
 case"closesheet":S.params={};if(cur()==="hole"){r.holes[r.cur].shots.forEach(s=>{if(s.unsure&&s.counted==null)s.counted=false});recount(r.holes[r.cur])}reRender();break;
 case"confirmdone":{const h=r.holes[r.cur];h.shots.forEach(s=>{if(s.unsure&&s.counted==null)s.counted=false});recount(h);S.params={};completeHole();break}
 case"advance":advance();break;
 case"card":go("scorecard",t.dataset.id?{id:t.dataset.id}:{});break;
 case"finish":finishRound();break;
 case"share":go("share",{id:t.dataset.id,mode:"card"});break;
 case"sharemode":S.params.mode=v;reRender();break;
 case"openround":go("summary",{id:t.dataset.id});break;
 case"askclear":S.params={ask:1};reRender();break;
 case"doclear":deleteMyRounds().then(()=>{S.params={};toast("Your rounds are cleared");reRender()});break;
 case"cat":S.params.cat=v;reRender();break;
 case"openprod":go("product",{id:t.dataset.id});break;
 case"pcolor":S.params.color=v;reRender();break;
 case"psize":S.params.size=v;reRender();break;
 case"addbag":{const p=prodById(S.params.id);const ex=S.cart.find(c=>c.id===p.id&&c.color===S.params.color&&c.size===S.params.size);if(ex)ex.qty++;else S.cart.push({id:p.id,color:S.params.color,size:S.params.size,qty:1});ls.set("rc_cart",S.cart);toast(`Added ${p.name} · ${S.params.size}`);reRender();break}
 case"qty":{const c=S.cart[+t.dataset.k];c.qty+=+t.dataset.d;if(c.qty<=0)S.cart.splice(+t.dataset.k,1);ls.set("rc_cart",S.cart);reRender();break}
 case"paym":S.params.pay=v;reRender();break;
 }}
function completeHole(){const r=S.round,h=r.holes[r.cur];if(!h.touched){advance();return}h.done=true;if(h.gir==null){const par=courseById(r.courseId).pars[r.cur];h.gir=(h.s-h.p)<=par-2}
 if(h.s===1){S.stack[S.stack.length-1]="ace";S.params={};render(true);return}advance()}
function advance(){const r=S.round;if(r.cur>=17){S.stack=["home","scorecard"];S.params={};render(true);return}r.cur++;S.stack=["home","hole"];S.params={};render(true)}
async function finishRound(){const r=S.round;r.holes.forEach((h,i)=>{if(!h.done&&(i===r.cur&&h.touched)){h.done=true;if(h.gir==null)h.gir=(h.s-h.p)<=courseById(r.courseId).pars[i]-2}});r.played=r.holes.filter(h=>h.done).length;
 const id=r.id;await saveRound(r);S.round=null;ls.set("rc_live",null);S.stack=["home","summary"];S.params={id};render(true);toast(S.store==="cloud"?"Round saved to your account":"Round saved on this phone")}

/* ============ auto stroke detection ============ */
function recount(h){if(!S.round||!S.round.auto)return;const swings=h.shots.filter(s=>s.counted).length;if(h.shots.length){h.s=Math.max(1,swings+h.p);h.touched=true}}
function logSwing(kind,src){const r=S.round;if(!r||r.done||cur()!=="hole")return;const h=r.holes[r.cur];
 const d=new Date();const time=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
 const s={kind,src,time,unsure:kind==="short",counted:kind==="short"?null:true};h.shots.push(s);
 if(!h.touched&&h.shots.length===1)h.p=Math.min(h.p,2);
 recount(h);reRender();
 if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
}
let lastPeak=0,peakBuf=[];
function onMotion(ev){const a=ev.accelerationIncludingGravity||ev.acceleration;if(!a||a.x==null)return;
 if(!S.motion.seen){S.motion.seen=true;if(cur()==="hole")reRender()}
 const g=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);const now=Date.now();
 peakBuf.push([now,g]);while(peakBuf.length&&now-peakBuf[0][0]>400)peakBuf.shift();
 if(now-lastPeak<3000)return;const pk=Math.max(...peakBuf.map(p=>p[1]));
 if(pk>30){lastPeak=now;peakBuf=[];logSwing("full","sensor")}
 else if(pk>19&&peakBuf.length>3){const rise=peakBuf[peakBuf.length-1][1]-peakBuf[0][1];if(Math.abs(rise)>8){lastPeak=now;peakBuf=[];logSwing("short","sensor")}}}
function armMotion(){if(!S.round||!S.round.auto||S.motion.listening)return;S.motion.listening=true;
 try{if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){/* iOS asks on a tap */
   const once=()=>{DeviceMotionEvent.requestPermission().then(st=>{if(st==="granted")window.addEventListener("devicemotion",onMotion)}).catch(()=>{});app.removeEventListener("click",once)};app.addEventListener("click",once)}
  else window.addEventListener("devicemotion",onMotion)}catch(e){}}

function mkS(s,p,size=22){if(s==null)return`<span class="mute">–</span>`;if(s===1)return`<span class="mk ace" style="width:${size}px;height:${size}px">${ic("flag",Math.round(size*.6),1.9)}</span>`;const d=s-p;const c=d<=-2?"eg":d===-1?"bd":d===0?"":d===1?"bg":"db";return`<span class="mk ${c}" style="width:${size}px;height:${size}px">${s}</span>`}

/* ---- round model: friends' scores live in r.others ---- */
const _newRound=newRound;
newRound=function(){_newRound();const r=S.round,c=courseById(r.courseId);r.tee=S.setup.tee||"White";r.others={};
 r.players.filter(p=>p!=="me").forEach(p=>{r.others[p]=c.pars.map(x=>({s:x,p:2,done:false}))});ls.set("rc_live",r)};
const playerScores=(r,pid)=>pid==="me"?r.holes.map(h=>h.done||h===r.holes[r.cur]&&r===S.round?h.s:null):(r.others&&r.others[pid]||[]).map((h,i)=>h.done||(r===S.round&&i===r.cur)?h.s:null);
function playerTot(r,pid,upto){const c=courseById(r.courseId);const sc=pid==="me"?r.holes:(r.others[pid]||[]);let s=0,p=0,n=0,pts=0;
 sc.forEach((h,i)=>{if(i>=(upto==null?18:upto))return;if(!(h.done))return;s+=h.s;p+=c.pars[i];n++;pts+=b36(h.s,c.pars[i])});return{s,p,n,over:s-p,pts}}

  h=h.replace('<div class="mapwrap" style="','<div class="mapwrap" style="zoom:.84;');h=h.replace(/(<div class="nav" style="height:60px">[\s\S]*?<\/div><\/div>[\s\S]*?<\/button><\/div>)/,`$1\n<div class="pad" style="display:grid;grid-template-columns:repeat(${r.players.length},1fr);justify-items:center;margin-top:4px">${r.players.map(tile).join("")}</div>`);

const _act=act;
act=function(a,t,v){const r=S.round;
 switch(a){
 case"who":S.params={who:v};reRender();return;
 case"fstep":{const fh=r.others[S.params.who][r.cur],k=t.dataset.k,d=+t.dataset.d,par=courseById(r.courseId).pars[r.cur];if(k==="s"){if(!fh.touched){fh.touched=true;fh.s=d>0?par:par-1;if(fh.p>fh.s)fh.p=fh.s}else{fh.s=Math.max(1,Math.min(15,fh.s+d));if(fh.p>fh.s)fh.p=fh.s}}else{if(!fh.pt&&!fh.touched){fh.pt=true;fh.p=d>0?1:0}else{fh.pt=true;fh.p=Math.max(0,fh.p+d)}if(fh.touched)fh.p=Math.min(fh.s,fh.p)}reRender();return}
 case"menu":S.params={menu:1,who:S.params.who};reRender();return;
 case"closemenu":S.params={who:S.params.who};reRender();return;
 case"nine":S.params.nine=+v;reRender();return;
 case"fixpar":{const c=courseById(r.courseId);const p=c.pars[r.cur]===5?3:c.pars[r.cur]+1;c.pars[r.cur]=p;(S.parfix[c.id]=S.parfix[c.id]||Array(18).fill(0))[r.cur]=p;ls.set("rc_parfix",S.parfix);toast(`Hole ${r.cur+1} is par ${p} now · saved for next time`);reRender();return}
 case"delround":if(!S.params.del){S.params.del=1;reRender();return}S.round=null;ls.set("rc_live",null);toast("Round deleted");home();return;
 case"rmode":S.params.rmode=v;reRender();return;
 case"tee":S.setup.tee=v;reRender();return;
 case"set":S.settings[v]=!S.settings[v];if(v==="auto"&&S.round&&!S.round.done)S.round.auto=S.settings.auto;if(v==="big")document.body.classList.toggle("bigui",S.settings.big);if(v==="awake")keepAwake(S.settings.awake&&!!S.round);saveSettings();reRender();return;
 case"defgame":S.settings.game=v;S.setup.mode=v;saveSettings();reRender();return;
 case"resetpars":if(!S.params.armp){S.params.armp=1;reRender();return}for(const id in S.parfix){const c=courseById(id);S.parfix[id].forEach((p,i)=>{if(p&&c.id===id&&c.defPars)c.pars[i]=c.defPars[i]})}S.parfix={};ls.set("rc_parfix",{});S.params={};toast("Course pars reset");reRender();return;
 case"wipe":if(!myRounds().length)return;if(!S.params.armw){S.params.armw=1;reRender();return}deleteMyRounds().then(()=>{S.params={};toast("All rounds deleted");reRender()});return;
 case"period":S.params.period=v;reRender();return;
 case"cstats":go("cstats",{id:t.dataset.id});return;
 case"half":S.params.half=+v;reRender();return;
 case"delsaved":{if(!S.params.armd){S.params.armd=1;reRender();return}const id=t.dataset.id;S.rounds=S.rounds.filter(x=>x.id!==id);ls.set("rc_rounds",myRounds());if(DB&&UID){DB.collection("data/users/"+UID).doc(id).delete().catch(()=>{})}toast("Round deleted");S.stack=["home","rounds"];S.params={};render(true);return}
 case"openclub":go("club",{id:t.dataset.id});return;
 case"logshot":go("logshot",{club:t.dataset.id||(cur()==="club"?S.params.id:"7i")});return;
 case"pclub":{S.params.club=v;const st=clubStats().find(x=>x.k===v);S.params.dist=st?st.avg:150;reRender();return}
 case"dist":S.params.dist=Math.max(5,Math.min(400,S.params.dist+(+t.dataset.d)));reRender();return;
 case"pswing":S.params.swing=v;reRender();return;
 case"pwhere":S.params.where=v;reRender();return;
 case"saveshot":{const P=S.params;S.shots.push({club:P.club||"7i",yds:P.dist,swing:P.swing,where:P.where,date:((d)=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))(new Date())});ls.set("rc_shots",S.shots);toast(`Saved ${clubName(P.club||"7i").toLowerCase()} · ${P.dist} yds`);const k=P.club||"7i";S.stack.pop();if(cur()==="club"){S.params={id:k};render(true)}else{S.stack.push("club");S.params={id:k};render(true)}return}
 case"tochart":{const el=document.getElementById("sizechart");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
 }
 _act(a,t,v)};

const calIso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const calParse=s=>{const [y,m,d]=(s||"").split("-").map(Number);return y?new Date(y,m-1,d):null};

 h=h.replace(/<label class="white row"([^>]*)>(\s*<svg[\s\S]*?<\/svg>)\s*<input id="rdate"[^>]*><\/label>/,`<div class="cal-wrap"><button class="white row${S.cal&&S.cal.open?" open":""}" data-act="calopen"$1>$2<span style="flex:1;font-size:18px;text-align:left">${lab}</span><span class="chev"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></button>@@CALPOP@@</div>`);

 let days="";for(let i=0;i<cells;i++){const d=calAdd(start,i);let c="cal-d";if(d.getMonth()!==view.getMonth())c+=" out";else if(d<today)c+=" past";if(same(d,today))c+=" today";if(same(d,sel))c+=" sel";days+=`<button class="${c}" data-act="calpick" data-v="${calIso(d)}" aria-label="${CALD[d.getDay()]} ${d.getDate()} ${CALM[d.getMonth()]}"${same(d,sel)?' aria-pressed="true"':""}>${d.getDate()}</button>`}

<div class="cal-grid">${days}</div></div>`)};
