<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ritually Club · Ritually edition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--page:#FFFFFF;--surface:#F3F5F8;--ink:#20252B;--ink2:#5B6470;--gray:#717A84;--line:#E4E8EE;--tint:#E8ECF1;
  --mint:#DDF2EA;--mint-ink:#2E6457;--butter:#FFF4D2;--danger:#B23A5E;
  --pix:"DotGothic16",ui-monospace,monospace;--sans:"Nunito",system-ui,sans-serif;
  --sc-u:#276B55;--sc-u-f:#CFF0E2;--sc-u-bar:#8FD3B6;--sc-e:#276B55;--sc-e-f:#A7E3C9;--sc-e-bar:#4FA584;--sc-p:#20252B;--sc-p-f:#FFF0C4;--sc-p-bar:#F3D27A;
  --sc-o:#35619A;--sc-o-f:#D7E9FB;--sc-o-bar:#9CC3EE;--sc-w:#9E4A33;--sc-w-f:#FCDCD0;--sc-w-bar:#F2A88E;color-scheme:light}
:root[data-theme="dark"]{--bg:#121716;--page:#111614;--surface:#1B211F;--ink:#ECF0EE;--ink2:#B7C0BC;--gray:#8F9995;--line:#2A322F;--tint:#232A27;
  --mint:#21362F;--mint-ink:#A8E0CF;--butter:#3A3424;--danger:#F29BB5;
  --sc-u:#8FD9BC;--sc-u-f:#1F3B33;--sc-e:#8FD9BC;--sc-e-f:#2B5246;--sc-p:#ECF0EE;--sc-p-f:#3A3424;--sc-o:#9CC3EE;--sc-o-f:#1F2F44;--sc-w:#F2A88E;--sc-w-f:#43281F;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121716;--page:#111614;--surface:#1B211F;--ink:#ECF0EE;--ink2:#B7C0BC;--gray:#8F9995;--line:#2A322F;--tint:#232A27;
  --mint:#21362F;--mint-ink:#A8E0CF;--butter:#3A3424;--danger:#F29BB5;
  --sc-u:#8FD9BC;--sc-u-f:#1F3B33;--sc-e:#8FD9BC;--sc-e-f:#2B5246;--sc-p:#ECF0EE;--sc-p-f:#3A3424;--sc-o:#9CC3EE;--sc-o-f:#1F2F44;--sc-w:#F2A88E;--sc-w-f:#43281F;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;font-weight:600;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
h1,h2,p{margin:0}
:focus-visible{outline:2.5px solid var(--mint-ink);outline-offset:2px;border-radius:8px}
#app{max-width:480px;margin:0 auto;min-height:calc(100dvh - 72px - env(safe-area-inset-bottom,0px));padding:calc(28px + env(safe-area-inset-top,0px)) 22px 20px;display:flex;flex-direction:column}
#app.scroll{padding-bottom:96px}
.grow{flex:1 1 auto;min-height:12px}
.pix{font-family:var(--pix);font-weight:400}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:15px;font-weight:800;color:var(--ink2)}
.kicker{font-size:13px;font-weight:800;color:var(--gray);letter-spacing:.02em}
.title{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.sub{font-size:15px;color:var(--ink2);margin-top:4px}
.sec{font-size:13px;font-weight:800;color:var(--gray);margin:24px 4px 8px}
.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:800;flex:none}
.primary:disabled{opacity:.4}
.list{background:var(--surface);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:12px 16px;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item .k{display:block;font-size:12px;font-weight:800;color:var(--gray)}
.item .v{display:block;font-size:16px;font-weight:800}
.item .m{display:block;font-size:13px;color:var(--gray);font-weight:600}
.item.danger .v{color:var(--danger)}
.chev{color:var(--gray);flex:none}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--ink2);flex:none}
.icon-btn:disabled{opacity:.3}
.muted{color:var(--gray)}
.danger{color:var(--danger)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:480px;margin:0 auto;height:72px;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:12px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800;color:var(--gray)}
nav.tabs button[aria-current="page"]{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none}
/* score marks */
.mk{position:relative;display:inline-grid;place-items:center;width:1em;height:1em;line-height:1}
.mk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mk b{position:relative;font-family:var(--pix);font-weight:400;font-size:.46em}
.m-under{color:var(--sc-u)}.m-par{color:var(--sc-p)}.m-over{color:var(--sc-o)}.m-worse{color:var(--sc-w)}
.m-under svg>:first-child{fill:var(--sc-u-f)}.m-over svg>:first-child{fill:var(--sc-o-f)}.m-worse svg>:first-child{fill:var(--sc-w-f)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.switch{flex:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch.on{background:var(--mint-ink)}.switch.on i{left:23px}
:root[data-theme="dark"] .switch.on i{background:var(--bg)}
/* home */
.wm{font-family:var(--pix);font-size:15px;letter-spacing:.16em}
.scene{margin-top:24px;border-radius:20px;overflow:hidden;background:var(--tint)}
.scene svg{display:block;width:100%;height:auto;aspect-ratio:72/40}
.last{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--surface);text-align:left}
.last .score{display:flex;align-items:baseline;gap:6px;flex:none}
.last .score b{font-family:var(--pix);font-weight:400;font-size:24px}
/* new round */
.item input[type=date]{font-size:16px;font-weight:800;color:var(--ink);width:100%;min-height:24px;background:none;-webkit-appearance:none;appearance:none}
.item input[type=date]::-webkit-calendar-picker-indicator{opacity:.45}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;background:var(--bg)}
.item[aria-checked="true"] .check,.item[aria-pressed="true"] .check{background:var(--mint-ink);border-color:var(--mint-ink);color:var(--bg)}
.addrow{display:flex;gap:8px;padding:10px 12px}
.addrow input{flex:1;min-width:0;height:44px;padding:0 12px;border-radius:12px;background:var(--bg);font-size:16px}
.addrow button{height:44px;padding:0 16px;border-radius:12px;background:var(--tint);font-weight:800}
.teams{margin:10px 4px 0;font-size:13px;font-weight:800;color:var(--ink2)}
/* courses */
.search{display:flex;align-items:center;gap:10px;height:48px;margin-top:20px;padding:0 14px;border-radius:14px;background:var(--surface);color:var(--gray)}
.search input{flex:1;height:100%;font-size:16px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--gray)}
.search input::-webkit-search-cancel-button{opacity:.5}
/* hole */
.prog{display:grid;grid-template-columns:repeat(var(--n,18),1fr);gap:3px;margin-top:10px}
.prog button{height:14px;display:flex;align-items:center}
.prog i{display:block;width:100%;height:6px;border-radius:3px;background:var(--line)}
.prog .done i{background:var(--sc-u-bar)}
.prog .cur i{background:var(--ink)}
.hhead{display:flex;align-items:flex-end;justify-content:space-between;margin-top:22px;gap:12px}
.hhead .title{font-size:40px;white-space:nowrap}
.par{display:inline-block;margin-left:8px;padding:4px 10px;border-radius:99px;background:var(--surface);font-size:14px;font-weight:800;color:var(--ink2);vertical-align:10px;letter-spacing:0}
.tot{text-align:right;flex:none}
.tot b{display:block;font-family:var(--pix);font-weight:400;font-size:28px;line-height:1}
.ask{margin-top:24px;font-size:15px;font-weight:800;color:var(--ink2);text-align:center}
.cpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.cpad button{height:66px;border-radius:16px;background:var(--surface);font-family:var(--pix);font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cpad button small{font-family:var(--sans);font-size:11px;font-weight:800;color:var(--gray);margin-top:4px;min-height:13px}
.cpad button.isPar{background:var(--sc-p-f)}
.cpad button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cpad button[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.no-labels .cpad button small{display:none}
.big-btns .cpad button{height:78px}
.more{display:flex;justify-content:center;gap:24px;margin-top:10px}
.more button{min-height:44px;padding:0 14px;font-size:14px;font-weight:800;color:var(--ink2);border-radius:12px}
.more button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.extras{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--surface)}
.extras .lbl,.mine .lbl{font-size:13px;font-weight:800;color:var(--gray)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:38px;height:40px;border-radius:12px;background:var(--tint);font-size:20px;font-weight:800;display:grid;place-items:center}
.step button:disabled{opacity:.35}
.step b{min-width:22px;text-align:center;font-family:var(--pix);font-weight:400;font-size:22px}
.ctee{display:flex;gap:4px}
.ctee button{width:38px;height:40px;border-radius:12px;background:var(--tint);display:grid;place-items:center;color:var(--ink2)}
.ctee button[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink);box-shadow:inset 0 0 0 1.5px var(--mint-ink)}
.vr{width:1px;align-self:stretch;background:var(--line)}
.players{margin-top:20px}
.pl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px;padding:12px 12px 12px 16px}
.pl+.pl,.mine+.pl{border-top:1px solid var(--line)}
.pl .who{min-width:0}
.pl .who b{display:block;font-size:17px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .who span{font-size:13px;color:var(--gray)}
.bigstep{display:flex;align-items:center;gap:8px;flex:none}
.bigstep>button{width:44px;height:44px;border-radius:12px;background:var(--tint);font-size:22px;font-weight:800;display:grid;place-items:center}
.bigstep .val{width:46px;height:46px;display:grid;place-items:center;background:none!important}
.bigstep .mk{font-size:46px}
.bigstep .empty{font-family:var(--pix);font-size:26px;color:var(--gray)}
.mine{border-top:1px solid var(--line);padding:8px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface)}
/* stats */
.period{display:flex;gap:20px;margin-top:14px}
.period button{min-height:36px;font-size:15px;font-weight:800;color:var(--gray);border-bottom:2.5px solid transparent}
.period button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;margin-top:22px;gap:12px}
.hero b{display:block;font-family:var(--pix);font-weight:400;font-size:72px;line-height:.9}
.hero .spark{color:var(--mint-ink)}
.goal{margin-top:12px;font-size:15px;color:var(--ink2)}
.goal strong{color:var(--ink)}
.focus{margin-top:22px;padding:16px;border-radius:16px;background:var(--butter)}
.focus .kicker{color:var(--sc-w)}
.focus h2{font-size:20px;font-weight:900;margin-top:2px}
.focus p{font-size:14px;color:var(--ink2);margin-top:4px}
.focus.ok{background:var(--mint)}.focus.ok .kicker{color:var(--mint-ink)}
.bk{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:10px 16px}
.bk+.bk{border-top:1px solid var(--line)}
.bk .v{font-weight:800}
.bk .m{display:block;font-size:13px;color:var(--gray)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;flex:none}
.est{text-align:right;flex:none}
.est small{display:block;font-size:11px;font-weight:800;color:var(--gray)}
.est b{font-family:var(--pix);font-weight:400;font-size:22px}
.rs{font-family:var(--pix);font-weight:400;font-size:22px}
/* scorecard */
.sum{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.sum b{font-family:var(--pix);font-weight:400;font-size:64px;line-height:1}
.cnine{margin-top:18px;background:var(--surface);border-radius:16px;padding:12px 10px 8px}
.cnine+.cnine{margin-top:10px}
.cnine .h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px}
.cnine .h>span:first-child{font-size:14px;font-weight:900}
.cnine .h b{font-family:var(--pix);font-weight:400;font-size:20px}
.g{display:grid;grid-template-columns:44px repeat(var(--n,9),minmax(0,1fr));align-items:center;text-align:center}
.g>*{height:30px;display:flex;align-items:center;justify-content:center;min-width:0}
.g .lab{justify-content:flex-start;padding-left:4px;font-size:11px;font-weight:800;color:var(--gray);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.g .n{font-size:12px;color:var(--gray)}
.g .s{height:38px}
.g .s .mk{font-size:30px}
.g .pt{font-family:var(--pix);font-size:14px;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;padding:0 4px;font-size:12px;color:var(--gray)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px}
.result{margin-top:16px}
.result .item{min-height:48px}
.result .rank{font-family:var(--pix);font-weight:400;color:var(--gray);margin-right:8px}
/* settings */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;padding:4px;border-radius:14px;background:var(--surface)}
.themes button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:11px;font-size:14px;font-weight:800;color:var(--ink2)}
.themes button span{font-size:18px;line-height:1;height:18px;display:grid;place-items:center}
.themes button[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink);box-shadow:inset 0 0 0 1.5px var(--mint-ink)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:8px 16px;text-align:left}
.tg+.tg{border-top:1px solid var(--line)}
.tg .v{font-weight:800;display:block}
.tg .m{display:block;font-size:12px;color:var(--gray);font-weight:600}
.foot{text-align:center;font-size:12px;color:var(--gray);margin-top:22px}
/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(10,14,13,.36);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheet-title{margin:0 4px 6px;font-weight:900;font-size:17px}
.sheet-title span{display:block;font-size:13px;font-weight:700;color:var(--gray)}
.sheet-btn{height:52px;border-radius:14px;background:var(--surface);font-weight:800;font-size:15px;text-align:center}
.sheet-btn.danger{color:var(--danger)}
.sheet-btn.cancel{background:none;color:var(--ink2)}
/* bag (calm skin) */
.bg-scr{display:flex;flex-direction:column;flex:1 1 auto}
.bg-scr .bar{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.back-icon{display:grid;place-items:center;width:44px;height:44px;margin-left:-12px;font-size:30px;line-height:1;color:var(--ink2);font-weight:700}
.bg-title{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.15;margin-top:12px}
.bg-sub{font-size:15px;color:var(--ink2);margin-top:4px}
.bg-sub b{font-family:var(--pix);font-weight:400;color:var(--ink)}
.bg-card{background:var(--surface);border-radius:16px;padding:14px 16px}
.bg-unit{display:inline-grid;grid-auto-flow:column;gap:2px;padding:3px;border-radius:11px;background:var(--surface)}
.bg-unit button{height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:800;color:var(--ink2)}
.bg-unit button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bg-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:800}
.bg-primary:disabled{opacity:.4}
.bg-badge{display:inline-grid;place-items:center;min-width:40px;height:30px;padding:0 6px;border-radius:9px;background:var(--bg);font-family:var(--pix);font-size:15px;flex:none}
.bg-card .bg-badge{background:var(--bg)}
.bg-badge.big{height:38px;min-width:50px;font-size:18px;background:var(--mint);color:var(--mint-ink)}
.bg-badge.bg-alert{background:var(--sc-w-f);color:var(--sc-w);font-family:var(--sans);font-weight:900}
.bg-badge.bg-ok{background:var(--mint);color:var(--mint-ink);font-family:var(--sans);font-weight:900}
.bg-sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px}
.bg-sum{background:var(--surface);border-radius:14px;padding:10px 12px 8px}
.bg-sum span{display:block;font-size:12px;font-weight:800;color:var(--gray)}
.bg-sum b{display:block;font-family:var(--pix);font-weight:400;font-size:26px;line-height:1.15}
.bg-sum small{font-size:11px;color:var(--gray);font-weight:700}
.bg-sum.hi{background:var(--mint)}.bg-sum.hi span,.bg-sum.hi small{color:var(--mint-ink)}
.bg-gap{display:flex;align-items:flex-start;gap:12px;margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--butter)}
.bg-gap:not(.warn){background:var(--surface)}
.bg-gap b{display:block;font-weight:900}
.bg-gap p{font-size:13px;color:var(--ink2)}
.bg-clubs{padding:4px 14px}
.bg-club{display:grid;grid-template-columns:44px 1fr 62px 10px;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 0;text-align:left}
.bg-add .bg-addtxt{grid-column:2/5;font-weight:800;color:var(--mint-ink,#2E7D5B)}
.bg-club+.bg-club{border-top:1px solid var(--line)}
.bg-track{position:relative;height:16px}
.bg-track::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line);border-radius:2px}
.bg-track i{position:absolute;top:3px;height:10px;border-radius:99px;background:var(--sc-u-f)}
.bg-track em{position:absolute;top:1px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--mint-ink);border:2.5px solid var(--surface)}
.bg-v{text-align:right;line-height:1.1}
.bg-v b{font-family:var(--pix);font-weight:400;font-size:20px}
.bg-v small{display:block;font-size:11px;color:var(--gray);font-weight:700}

.bg-strip{position:relative;height:74px;margin:6px 4px 0}

.course-menu{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 8px;font-size:13px;font-weight:800;color:var(--ink2)}

.scene{background:none}

.crow .cbar s{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--sc-u-f)}
.crow .cbar em{position:absolute;top:-3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--mint-ink);border:2.5px solid var(--surface)}

.bg-clubs{padding:2px 16px}
/* live scorecard sheet */
.sheet.lv{gap:10px;max-height:88dvh;overflow:auto}
.lv-nine{background:var(--surface);border-radius:14px;padding:10px 8px 6px}
.lv-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px;font-size:13px;font-weight:900}

button.golf-total{cursor:pointer;font:inherit;font-family:var(--pix);color:inherit}
.tot-btn{text-align:right;flex:none;border-radius:12px;padding:2px 4px}

.tot-top span{font-size:11px;font-weight:800;color:var(--gray)}

/* ---------- console shell ---------- */
.stage{z-index:25;position:fixed;left:0;right:0;top:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 12px}
.gb{position:relative;width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;padding:14px 16px 16px;background:var(--case);border:1.5px solid var(--case-edge);border-radius:12px 12px 44px 12px;box-shadow:4px 5px 0 rgba(22,22,23,.16);
  background-image:linear-gradient(90deg,rgba(120,98,76,.06) 0 1px,transparent 1px 100%),linear-gradient(90deg,rgba(255,255,255,.5) 0 2px,transparent 2px 100%);background-size:44px 100%,44px 100%;background-position:0 0,1px 0}

#app{flex:1 1 auto;min-height:0!important;max-width:none!important;margin:0!important;padding:12px 12px 14px!important;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}

/* ---------- tab bar ---------- */

.kicker{font-size:11px!important}.sec{font-size:11px!important;color:var(--ink2)!important}
.item .k{font-size:10.5px!important}

/* black woven selected states */

.kx-seg button[aria-pressed="true"],.bg-seg button[aria-pressed="true"],.bg-unit button[aria-pressed="true"],.who-row button[aria-selected="true"],.bg-clubgrid button[aria-pressed="true"],.ctee button[aria-pressed="true"],.more button[aria-pressed="true"]{background:var(--label)!important;color:var(--onlabel)!important;border-color:var(--label)!important;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)!important}

.switch.on{background:var(--label)!important}
.check{border-radius:2px!important}
.sheet{background:var(--surface)!important;border-top:1.5px solid var(--ink)}

/* numbers in the pixel font */

/* shop */
nav.tabs .in{grid-template-columns:repeat(5,1fr)!important}
.sc-in>*{flex-shrink:0}
.sizes button,.cats button,.sw button,.pay button{text-align:center;justify-content:center}
.shop-top{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.bagbtn{position:relative;display:grid;place-items:center;width:38px;height:38px;border:1.5px solid var(--ink);background:var(--ivory);box-shadow:2px 3px 0 rgba(22,22,23,.14)}
.bagbtn em{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 4px;background:var(--label);color:var(--ivory);font-style:normal;font-family:var(--pix);font-size:11px;display:grid;place-items:center}
.drop{position:relative;margin-top:12px;padding:14px 14px 12px;background:var(--surface);border:1.5px solid var(--ink);box-shadow:3px 4px 0 rgba(22,22,23,.14);display:flex;align-items:center;gap:10px;
  background-image:linear-gradient(90deg,rgba(120,98,76,.07) 0 1px,transparent 1px 100%),linear-gradient(90deg,rgba(255,255,255,.6) 0 2px,transparent 2px 100%);background-size:40px 100%,40px 100%}
.drop .tx{flex:1}
.drop .tx b{display:block;font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.05;margin:3px 0 6px}
.drop .tx span.go{font-family:var(--pix);font-size:12px;letter-spacing:.04em;border-bottom:1.5px solid var(--ink)}
.drop .art{display:flex;align-items:flex-end;gap:2px}
.cats{display:flex;gap:6px;margin:14px 0 10px;overflow:hidden}
.cats button{flex:none;height:32px;padding:0 12px;border:1.5px solid var(--ink);background:var(--ivory);font-size:13px;font-weight:600;border-radius:2px}
.cats button[aria-pressed="true"]{background:var(--label);color:var(--ivory)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{display:block;text-align:left;background:var(--ivory);border:1.5px solid var(--ink);box-shadow:3px 4px 0 rgba(22,22,23,.14)}
.pcard .ph{position:relative;display:grid;place-items:center;height:118px;background:var(--tint);border-bottom:1.5px solid var(--ink)}
.pcard .ph i{position:absolute;left:6px;top:6px;font-style:normal;font-family:var(--serif);font-weight:700;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;background:var(--label);color:var(--ivory);padding:2px 6px}
.pcard .nm{display:block;padding:8px 10px 0;font-size:13.5px;font-weight:600;line-height:1.2}
.pcard .sb{display:block;padding:2px 10px 0;font-size:11px;color:var(--gray)}
.pcard .pr{display:block;padding:4px 10px 9px;font-family:var(--pix);font-size:16px}
/* product */
.pd-hero{position:relative;margin:8px 0 0;height:230px;display:grid;place-items:center;background:var(--tint);border:1.5px solid var(--ink);box-shadow:3px 4px 0 rgba(22,22,23,.14)}
.pd-hero .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}

.pd-name{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px}

.pd-k{display:flex;justify-content:space-between;margin:14px 2px 7px;font-family:var(--serif);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.pd-k a{font-family:var(--sans);font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink);text-decoration:underline}
.sw{display:flex;gap:8px}

.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

.pd-notes{margin-top:14px;padding:10px 12px;background:var(--ivory);border-left:3px solid var(--ink);font-size:13px;color:var(--ink2);line-height:1.5}
/* bag + checkout */
.ci{display:flex;gap:12px;align-items:center;padding:10px 12px}
.ci+.ci{border-top:1px solid var(--line)}
.ci .th{flex:none;width:64px;height:64px;display:grid;place-items:center;background:var(--tint);border:1.5px solid var(--ink)}
.ci .tx{flex:1;min-width:0}
.ci .tx b{display:block;font-size:14.5px;font-weight:600}
.ci .tx small{display:block;font-size:12px;color:var(--gray)}
.ci .qty{display:inline-flex;align-items:center;margin-top:6px;border:1.5px solid var(--ink)}
.ci .qty button{width:26px;height:24px;font-family:var(--pix);font-size:14px}
.ci .qty span{min-width:22px;text-align:center;font-family:var(--pix);font-size:14px}
.ci .pr{font-family:var(--pix);font-size:16px;align-self:flex-start}
.promo{display:flex;gap:8px;margin-top:12px}
.promo span{flex:1;display:flex;align-items:center;height:40px;padding:0 12px;border:1.5px dashed var(--ink2);font-size:13px;color:var(--gray);background:var(--ivory)}
.promo button{height:40px;padding:0 14px;border:1.5px solid var(--ink);font-weight:700;font-size:13px;background:var(--ivory)}

.ship-note{margin-top:8px;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:8px}

.ship-note .pbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 8px)}
.ck{padding:10px 12px}
.ck .k{display:block;font-family:var(--serif);font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}

.ck .m{display:block;font-size:12px;color:var(--gray)}
.ck+.ck{border-top:1px solid var(--line)}
.ck.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.radio{flex:none;width:16px;height:16px;border:1.5px solid var(--ink);background:var(--ivory)}
.radio.on{background:var(--ink);box-shadow:inset 0 0 0 3px var(--ivory)}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pay button{height:46px;border:1.5px solid var(--ink);background:var(--ivory);font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:2px 3px 0 rgba(22,22,23,.12)}
.pay button small{font-size:10px;font-weight:500;color:var(--gray)}
.pay button[aria-pressed="true"]{background:var(--label);color:var(--ivory)}.pay button[aria-pressed="true"] small{color:#CFC6BB}
/* order placed */
.done-art{margin-top:6px;height:200px;display:flex;align-items:flex-end;justify-content:center;gap:8px;padding-bottom:14px;background:var(--tint);border:1.5px solid var(--ink);box-shadow:3px 4px 0 rgba(22,22,23,.14);position:relative}
.done-art .stamp{position:absolute;top:14px;right:14px;transform:rotate(8deg);border:2px solid var(--ink);padding:4px 8px;font-family:var(--pix);font-size:13px;background:var(--ivory)}
.done-h{margin-top:16px;font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.05}
.done-p{margin-top:6px;font-size:14px;color:var(--ink2)}
.trk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px}

.trk span.on{color:var(--ink)}

.sc-pad{padding-top:2px}
.drop{width:100%;text-align:left}
.ck.row{width:100%;text-align:left}
.shop-top .bagbtn{color:var(--ink)}
.shop-top .bagbtn svg rect[fill="#161617"]{fill:var(--ink)}
.pcard .ph svg,.pd-hero svg,.ci .th svg,.drop .art svg,.done-art svg{image-rendering:pixelated}
.pgrid .pcard{width:100%}
.pd-hero{height:200px}
.cats{overflow-x:auto;scrollbar-width:none}
.form{display:flex;flex-direction:column}
.form label{display:block;padding:8px 12px}

.form label span{display:block;font-family:var(--serif);font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}
.form input{width:100%;margin-top:2px;padding:4px 0;border:0;border-bottom:1.5px dashed var(--line);background:none;font-size:15px;font-weight:600;color:var(--ink);outline:none}

.demo{margin-top:10px;font-size:11.5px;color:var(--gray);text-align:center}
.empty-bag{margin-top:24px;text-align:center}
.empty-bag p{margin-top:8px;color:var(--ink2);font-size:14px}
.ordrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left}
.ordrow+.ordrow{border-top:1px solid var(--line)}
.ordrow b{font-family:var(--pix);font-weight:400}
.ordrow small{display:block;font-size:12px;color:var(--gray)}
.sumx div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

body.cs-club .ch-scene{flex:1 1 auto!important;aspect-ratio:auto!important;min-height:150px}
.ch-scene svg{position:absolute;inset:0;width:100%;height:100%}

.sh-hero{margin-top:8px;filter:drop-shadow(1.5px 0 0 var(--ink)) drop-shadow(-1.5px 0 0 var(--ink)) drop-shadow(0 1.5px 0 var(--ink)) drop-shadow(0 -1.5px 0 var(--ink)) drop-shadow(3px 4px 0 rgba(22,22,23,.16))}
.sh-card{background:var(--surface);padding:14px 14px 12px;background-image:linear-gradient(90deg,rgba(120,98,76,.06) 0 1px,transparent 1px 100%);background-size:48px 100%}

.sh-head{display:flex;align-items:center;justify-content:space-between}

.sh-club{font-family:var(--serif);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
.sh-art{position:relative;margin:10px 0 0;height:96px;overflow:hidden;border:1.5px solid var(--ink)}

.sh-art.day{filter:sepia(.5) saturate(.62) brightness(1.03) contrast(.96)}
.sh-course{margin:10px 0 0;font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.1}
.sh-date{margin:3px 0 0;font-family:var(--serif);font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}
.sh-score{display:flex;align-items:flex-end;gap:12px;margin-top:6px}

.sh-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:10px}
.sh-c{display:grid;place-items:center;height:24px;font-style:normal;font-family:var(--pix);font-size:13px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.sh-c.e{background:var(--sc-e-f);color:var(--sc-e);box-shadow:inset 0 0 0 1.5px var(--sc-e);border-radius:50%}

.sh-cap{margin-top:10px;width:100%;height:40px;padding:0 12px;border:1.5px solid var(--ink);border-radius:3px;background:var(--ivory);font:inherit;font-size:14px;color:var(--ink)}

.v3-chart{margin-top:12px;padding:12px 12px 8px}
.mixc{padding:10px 12px}

.mix .p,.mix-leg i.p{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}

<script>
(function(){
const $app = document.getElementById('app'), $tabs = document.getElementById('tabs'), $toast = document.getElementById('toast');
const STD72 = [4,4,3,4,5,4,3,4,5,4,4,3,4,5,4,3,4,5];
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = (back = 0) => { const d = new Date(); d.setDate(d.getDate() - back); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = s => { try { return new Date(s + 'T12:00:00').toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}); } catch(e) { return s; } };
const pts = n => n + (n === 1 ? ' pt' : ' pts');
const toPar = n => n === 0 ? 'E' : (n > 0 ? '+' + n : '\u2212' + Math.abs(n));
const sum = a => a.reduce((x,y) => x + (y || 0), 0);
function toast(m){ $toast.textContent = m; $toast.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => $toast.hidden = true, 2200); }

/* Bangkok-area courses (pars start as a standard par 72 until you fix them) */
const COURSES = [
  ['alpine','Alpine Golf & Sports Club','Pathum Thani'],['thaicc','Thai Country Club','Chachoengsao'],['nikanti','Nikanti Golf Club','Nakhon Pathom'],
  ['riverdale','Riverdale Golf Club','Pathum Thani'],['rbsc','Royal Bangkok Sports Club','Pathum Wan'],['navatanee','Navatanee Golf Course','Bang Kapi'],
  ['panya','Panya Indra Golf Club','Khan Na Yao'],['thana','Thana City Country Club','Bang Na'],['lakewood','Lakewood Country Club','Bang Na'],

/* Games */
function holeWinners(r, carry){
  const won = {}; r.players.forEach(p => won[p.id] = 0); let pot = 1;
  r.course.pars.forEach((_, i) => {
    const sc = r.players.map(p => ({id:p.id, s:r.cards[p.id][i].s}));
    if (sc.some(x => x.s == null)) return;
    const low = Math.min(...sc.map(x => x.s)), best = sc.filter(x => x.s === low);
    if (best.length === 1) { won[best[0].id] += carry ? pot : 1; pot = 1; } else if (carry) pot++;
  });
  return won;
}
const scored = g => !!(GAMES[g] && (GAMES[g].pts || GAMES[g].round));
const gpts = (r, n) => { const u = GAMES[r.game].unit || ['pt','pts']; return n + ' ' + (n === 1 ? u[0] : u[1]); };
const GAMES = {
  stroke:{name:'Stroke play', rule:'Count every shot. Lowest total wins.'},
  stableford:{name:'Stableford', rule:'Bogey = 1 point, par = 2, birdie = 3, eagle = 4. Most points wins.', pts:(s, par) => Math.max(0, 2 - (s - par))},
  match:{name:'Match play', rule:'Fewest shots wins the hole. Most holes won wins. Needs 2+ players.', min:2, unit:['hole','holes'], round:r => holeWinners(r, false)},
  skins:{name:'Skins', rule:'Fewest shots wins a skin. A tie carries the skin to the next hole. Needs 2+ players.', min:2, unit:['skin','skins'], round:r => holeWinners(r, true)},
  _team:{name:'Team play', rule:'You and your first friend vs the other two. The better score on each hole wins it for the team. Needs 4 players.', min:4, unit:['hole','holes'], round:r => teamHoles(r)},
  break36:{name:'Break 36', rule:'Par or better = 2 points, bogey = 1, worse = 0. Most points wins.', pts:(s, par) => s - par <= 0 ? 2 : s - par === 1 ? 1 : 0}
};
GAMES.team = GAMES._team; delete GAMES._team;


function teamHoles(r){
  const won = {}; r.players.forEach(p => won[p.id] = 0);
  if (r.players.length < 4) return won;
  const A = r.players.slice(0, 2), B = r.players.slice(2, 4);
  r.course.pars.forEach((_, i) => {
    const best = team => { const s = team.map(p => r.cards[p.id][i].s); return s.some(x => x == null) ? null : Math.min(...s); };
    const a = best(A), b = best(B); if (a == null || b == null || a === b) return;
    (a < b ? A : B).forEach(p => won[p.id]++);
  });
  return won;
}
const teamsLine = players => players.length >= 4 ? `Team 1: ${players.slice(0,2).map(p => esc(p.name)).join(' & ')} · Team 2: ${players.slice(2,4).map(p => esc(p.name)).join(' & ')}` : '';

/* ---------- theme: auto follows the phone, or pick light / dark ---------- */
const TKEY = 'ritually-theme';
function applyTheme(t){
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  const dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  let m = document.querySelector('meta[name="theme-color"]'); if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
  m.content = dark ? '#212428' : '#F7F3EE';
}
let THEME = 'auto'; try { THEME = localStorage.getItem(TKEY) || 'auto'; } catch(e) {}
applyTheme(THEME);
function themeCard(){
  const opts = [['light', '\u2600\uFE0E', 'Day golf', 'Sunny fairway, mint console, light panels'], ['dark', '\u263E', 'Night golf', 'Moonlit fairway, deep teal console, dark panels'], ['auto', '\u25D0', 'Auto', 'Switches with your phone’s setting']];
  return `<p class="sec">Theme</p><div class="theme-row" role="radiogroup" aria-label="Theme">${opts.map(([k, ic, t]) => `<button data-a="theme" data-v="${k}" role="radio" aria-checked="${THEME === k}"><span class="theme-swatch theme-${k}" aria-hidden="true"><i></i><em>${ic}</em></span>${t}</button>`).join('')}</div>`;
}


/* ---------- original pixel art (Ritually Club buddy) ---------- */
const PAL = {k:'#24363A', w:'#FFFFFF', R:'#B83A55', s:'#FFFFFF', g:'#D7E3E3', p:'#F6A3BE', r:'#E9566F', y:'#FFD15C', G:'#7FCB8E', D:'#5BAE72', L:'#A6DDB0', s:'#FFFFFF', b:'#8A6A4A'};
const BUDDY = [
  '....rrrrrr....',
  '...rrrrrrrr...',
  '..rrrrrrrrRRRR',
  '..kwwwwwwwwk..',
  '.kwwgwwwwgwwk.',
  'kwwwwwwwwwwwwk',
  'kwwkkwwwwkkwwk',
  'kwwkswwwwkswwk',
  'kwpwwwwwwwwpwk',
  'kwwwwkwwkwwwwk',
  '.kwwwwkkwwwwk.',
  '.kwgwwwwwwgwk.',
  '..kkwwwwwwkk..',
  '....kkkkkk....'];
const FLAG = [
  'kkkkkk..',
  'krrrrrk.',
  'krrrrrrk',
  'krrrrrk.',
  'kkkkkk..',
  'k.......',
  'k.......',
  'k.......',
  'k.......',
  'k.......',
  'k.......',
  'k.......'];
const ICON_PLAY = ['kkkk....','kyyyk...','kyyyyk..','kyyyk...','kkkk....','k.......','k.......','kkk.....'];
const ICON_STATS = ['......kk','......kk','...kk.kk','...kk.kk','kk.kk.kk','kk.kk.kk','kk.kk.kk','kkkkkkkk'];
const ICON_BAG = ['.kk..k..','..k.kk..','..k.k...','.kkkkkk.','.kggggk.','.kggggk.','.kggggk.','.kkkkkk.'];
const ICON_SET = ['...kk...','.k.kk.k.','..kkkk..','kkk..kkk','kkk..kkk','..kkkk..','.k.kk.k.','...kk...'];
function px(map, x, y, pal = PAL){
  let out = '';
  map.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') out += `<rect x="${x + i}" y="${y + j}" width="1.02" height="1.02" fill="${pal[ch] || ch}"/>`; }));
  return out;
}
function sprite(map, size, pal){ const w = map[0].length, h = map.length; return `<svg viewBox="0 0 ${w} ${h}" width="${size}" height="${size * h / w}" shape-rendering="crispEdges" aria-hidden="true">${px(map, 0, 0, pal)}</svg>`; }
const iconPal = c => ({...PAL, k:c, y:'#FFD15C', g:'#7FCB8E'});
const SCENES = {};
function isDark(){ return getComputedStyle(document.documentElement).getPropertyValue('--page').trim().toLowerCase() === '#111614'; }
function scene(){
  const night = isDark(), key = night ? 'n' : 'd';
  if (SCENES[key]) return SCENES[key];
  const W = 72, H = 40, P = night
    ? {sky1:'#17243C', skyM:'#1F304D', sky2:'#2A3D5E', sun:'#F4EFD2', sunE:'#D9D3AE', cloud:'#3A4E73', hill:'#2E4A47', trees:'#203833', trunk:'#3A2E28', f1:'#2F5E46', f2:'#346A4E', green:'#4B8A63', sand:'#8C8466', sandD:'#76704F', flag:'#E46A80', pole:'#E8ECEA', star:'#E8ECF6', shadow:'#244634'}
    : {sky1:'#A3D3EC', skyM:'#BCE0F1', sky2:'#D6EEF6', sun:'#FFF3C4', sunE:'#FFE38A', cloud:'#FFFFFF', hill:'#9ACBA9', trees:'#5E9C78', trunk:'#7A5A44', f1:'#7FC891', f2:'#8BD29C', green:'#B4E6BE', sand:'#F2E2AE', sandD:'#E0CB8C', flag:'#E5506B', pole:'#3B4744', star:null, shadow:'#69B07D'};
  let r = '';
  const dot = (x, y, c) => { r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${c}"/>`; };
  const ell = (cx, cy, rx, ry, c) => { for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) if (((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1) dot(x, y, c); };
  /* sky with a dithered fade toward the horizon */
  const band = y => y < 8 ? P.sky1 : y < 15 ? P.skyM : P.sky2;
  for (let y = 0; y < 22; y++) for (let x = 0; x < W; x++) dot(x, y, (y === 8 || y === 15) && (x % 2 === 0) ? band(y - 1) : band(y));
  if (night) [[6,3],[15,7],[27,2],[39,5],[48,9],[63,4],[68,10],[21,12],[33,9]].forEach(([x, y]) => dot(x, y, P.star));
  ell(58, 8, 4, 4, P.sunE); ell(58, 8, 3.2, 3.2, P.sun);
  if (night) { /* bite the sky back out of the disc: a crescent moon */
    for (let y = 3; y <= 12; y++) for (let x = 53; x <= 63; x++) {
      const inDisc = ((x + .5 - 58) / 4) ** 2 + ((y + .5 - 8) / 4) ** 2 <= 1;
      const inBite = ((x + .5 - 60.2) / 3.3) ** 2 + ((y + .5 - 6.6) / 3.3) ** 2 <= 1;
      if (inDisc && inBite) dot(x, y, (y === 8 || y === 15) && (x % 2 === 0) ? band(y - 1) : band(y));
    }
  }
  [[8,6],[30,10]].forEach(([x, y]) => { ell(x + 3, y + 1, 3, 1.6, P.cloud); ell(x + 6, y, 3, 2, P.cloud); ell(x + 9, y + 1, 2.5, 1.4, P.cloud); });
  /* rolling hills and tree line */
  for (let x = 0; x < W; x++) { const top = Math.round(17 + Math.sin(x / 7) * 1.6 + Math.sin(x / 3.1) * .6); for (let y = top; y < 23; y++) dot(x, y, P.hill); }
  for (let x = 0; x < W; x++) { const top = Math.round(20 + Math.abs(Math.sin(x * 1.3)) * 1.4 + (x % 5 === 0 ? -1 : 0)); for (let y = top; y < 24; y++) dot(x, y, P.trees); }
  /* fairway with mowing stripes */
  for (let y = 23; y < H; y++) for (let x = 0; x < W; x++) dot(x, y, Math.floor((x - (y - 23) * 1.4) / 6) % 2 === 0 ? P.f1 : P.f2);
  /* green, flag, bunker, tree */
  ell(55, 26, 9, 2.6, P.green);
  for (let y = 16; y < 26; y++) dot(55, y, P.pole);
  [[56,16],[57,16],[58,16],[59,16],[56,17],[57,17],[58,17],[59,17],[60,17],[56,18],[57,18],[58,18],[59,18]].forEach(([x, y]) => dot(x, y, P.flag));
  ell(41, 31, 5, 1.7, P.sandD); ell(41, 30.6, 4.4, 1.3, P.sand);
  for (let y = 22; y < 29; y++) { dot(66, y, P.trunk); }
  ell(66, 19, 4, 4.5, P.trees); ell(64.5, 17.5, 2, 2, P.hill);
  /* buddy on a tee */
  ell(16.5, 36.3, 5, 1, P.shadow);
  r += px(['.ww.','..w.','..w.'].map(row => row.replace(/w/g, 'T')), 15, 33, {T:night ? '#D9D2BE' : '#FFFFFF'});
  r += px(BUDDY, 10, 19);
  SCENES[key] = `<svg viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" role="img" aria-label="Pixel golf ball buddy on a tee, looking down the fairway at the flag${night ? ' under a crescent moon' : ''}">${r}</svg>`;
  return SCENES[key];
}
const GEAR = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>`;
function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function dateTag(){ return new Date().toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short'}).toUpperCase().replace(',', ''); }

/* ---------- state + saving (fresh start) ---------- */
const S = {ready:false, tab:'play', screen:null, rounds:[], prefs:{friends:[], courseId:null, game:'stroke', fixed:{}, hint:false, autoNext:true, fairway:true, labels:true, bigButtons:false, awake:false}, setup:null, q:'', period:'all', armed:null};
const KEY = 'ritually-simple-v1';
const store = {
  db:null, uid:null, timers:{},
  async init(){
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        const uid = user ? await user.id() : null;
        if (db && uid) {
          this.db = db; this.uid = uid;
          const col = db.collection('data/users/' + uid);
          const snap = await col.get();
          snap.docs.forEach(d => { const v = clone(d.data()); if (v.kind === 'rc-round') S.rounds.push(v); if (v.kind === 'rc-prefs') Object.assign(S.prefs, v.prefs || {}); if (v.kind === 'rc-bag') bagStore.load(v); });
          return;
        }
      }
    } catch(e) { this.db = null; }
    try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) { S.rounds = d.rounds || []; Object.assign(S.prefs, d.prefs || {}); } } catch(e) {}
    try { bagStore.load(JSON.parse(localStorage.getItem(BKEY) || 'null')); } catch(e) {}
  },
  local(){ try { localStorage.setItem(KEY, JSON.stringify({rounds:S.rounds, prefs:S.prefs})); } catch(e) {} },
  async write(id, data, del){
    if (!this.db) return this.local();
    const ref = this.db.collection('data/users/' + this.uid).doc(id);
    try { del ? await ref.delete() : await ref.set(clone(data)); }
    catch(e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600)); try { del ? await ref.delete() : await ref.set(clone(data)); return; } catch(e2) {} } toast('Couldn\u2019t save. Check your connection.'); }
  },
  saveRound(r, now){ clearTimeout(this.timers[r.id]); if (!this.db) return this.local(); if (now) return this.write(r.id, r); this.timers[r.id] = setTimeout(() => this.write(r.id, r), 500); },
  deleteRound(r){ clearTimeout(this.timers[r.id]); return this.write(r.id, null, true); },
  savePrefs(){ return this.write('prefs', {kind:'rc-prefs', prefs:S.prefs}); }
};


/* ---------- Bag: how far each club carries ---------- */
const CLUBS = [['Dr','Driver'],['3W','3 wood'],['5W','5 wood'],['4H','4 hybrid'],['5i','5 iron'],['6i','6 iron'],['7i','7 iron'],['8i','8 iron'],['9i','9 iron'],['PW','Pitching wedge'],['GW','Gap wedge'],['SW','Sand wedge'],['LW','Lob wedge']];
const clubName = k => (CLUBS.find(c => c[0] === k) || [k, k])[1];
const BKEY = 'ritually-bag-v1';
const BAG = {unit:'yd', shots:[]};
const bagStore = {
  load(data){ if (data) { BAG.unit = data.unit || 'yd'; BAG.shots = data.shots || []; } },
  local(){ try { localStorage.setItem(BKEY, JSON.stringify(BAG)); } catch(e) {} },
  save(){ if (!store.db) return this.local(); return store.write('bag', {kind:'rc-bag', unit:BAG.unit, shots:BAG.shots}); }
};
const yd2 = y => BAG.unit === 'm' ? Math.round(y * 0.9144) : Math.round(y);
const unitWord = (long) => BAG.unit === 'm' ? (long ? 'metres' : 'm') : (long ? 'yards' : 'yd');
const SWINGS = [['full','Full'],['3q','¾'],['half','½']], WHERES = [['range','Range'],['course','Course'],['sim','Sim']];
function quart(sorted, q){ if (!sorted.length) return null; const p = (sorted.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return sorted[lo] + (sorted[hi] - sorted[lo]) * (p - lo); }
function clubStats(k){
  const all = BAG.shots.filter(s => s.c === k), full = all.filter(s => s.sw === 'full');
  const use = full.length ? full : all;
  if (!use.length) return {k, n:all.length, avg:null};
  const d = use.map(s => s.d).sort((a, b) => a - b);
  return {k, n:all.length, avg:d.reduce((a, b) => a + b, 0) / d.length, lo:d[0], hi:d[d.length - 1], q1:quart(d, .25), q3:quart(d, .75), fullOnly:!!full.length};
}
function bagSummary(){
  const st = CLUBS.map(([k]) => clubStats(k)), withData = st.filter(x => x.avg != null);
  let gap = null;
  for (let i = 0; i < withData.length - 1; i++) {
    const a = withData[i], b = withData[i + 1], g = a.avg - b.avg;
    const bad = g < 8 ? 8 - g : g > 20 ? g - 20 : 0;
    if (bad > 0 && (!gap || bad > gap.bad)) gap = {a, b, g, bad, kind:g < 8 ? 'close' : 'wide'};
  }
  const wide = withData.filter(x => x.n >= 3).sort((a, b) => (b.hi - b.lo) - (a.hi - a.lo))[0];
  return {st, withData, gap, wide};
}
function bagGapNote(sum){
  if (sum.withData.length < 2) return '';
  if (sum.gap) {
    const {a, b, g, kind} = sum.gap;
    return `<div class="bg-gap warn"><span class="bg-badge bg-alert">!</span><div><b>Gap to check: ${clubName(a.k)} → ${clubName(b.k)}</b><p>${kind === 'close' ? `Only ${yd2(g)} ${unitWord()} apart, so these two clubs do nearly the same job.` : `${yd2(g)} ${unitWord()} apart. Most players space clubs 10–15 yards, so you may be missing a club here.`}${sum.wide ? ` Your ${clubName(sum.wide.k)} has the widest spread (${yd2(sum.wide.hi - sum.wide.lo)} ${unitWord()}).` : ''}</p></div></div>`;
  }
  return `<div class="bg-gap"><span class="bg-badge bg-ok">✓</span><div><b>Your gaps look even</b><p>Clubs with shots logged are 8–20 yards apart.${sum.wide ? ` Your ${clubName(sum.wide.k)} has the widest spread (${yd2(sum.wide.hi - sum.wide.lo)} ${unitWord()}).` : ''}</p></div></div>`;
}

function bagAction(a, v){
  const L = S.bagLog;
  switch (a) {
    case 'bag-unit': BAG.unit = v; bagStore.save(); if (L) L.d = ''; render(); return true;
    case 'bag-club': S.bagView = v; render(); scrollTo(0,0); return true;
    case 'bag-back': S.bagView = S.bagFrom || null; S.bagFrom = null; render(); scrollTo(0,0); return true;
    case 'bag-log': {
      const lastShot = BAG.shots[BAG.shots.length - 1];
      S.bagFrom = S.bagView && S.bagView !== 'log' ? S.bagView : null;
      S.bagLog = {c:v || (lastShot && lastShot.c) || '7i', d:'', sw:'full', w:live() ? 'course' : (lastShot ? lastShot.w : 'range')};
      S.bagView = 'log'; render(); scrollTo(0,0); return true;
    }
    case 'bag-pick': L.c = v; render(); return true;
    case 'bag-sw': L.sw = v; render(); return true;
    case 'bag-where': L.w = v; render(); return true;
    case 'bag-key': if (L.d.length < 3 && !(L.d === '' && v === '0')) L.d += v; render(); return true;
    case 'bag-del-digit': L.d = L.d.slice(0, -1); render(); return true;
    case 'bag-last': { const last = [...BAG.shots].reverse().find(s => s.c === L.c); if (last) L.d = String(yd2(last.d)); render(); return true; }
    case 'bag-save': {
      const n = +L.d; if (!n) return true;
      const yards = BAG.unit === 'm' ? n / 0.9144 : n;
      if (yards > 420) { toast('That’s a long one. Check the number.'); return true; }
      const r = live();
      BAG.shots.push({id:'s-' + newId(), c:L.c, d:Math.round(yards * 10) / 10, sw:L.sw, w:L.w, date:today(), at:L.w === 'course' && r ? r.course.name : ''});
      bagStore.save(); toast(`Saved ${clubName(L.c)} · ${n} ${unitWord()}`); L.d = ''; render(); return true;
    }
    case 'bag-del': {
      if (S.armed !== 'shot' + v) { S.armed = 'shot' + v; render(); return true; }
      BAG.shots = BAG.shots.filter(s => s.id !== v); S.armed = null; bagStore.save(); toast('Shot deleted.'); render(); return true;
    }
  }
  return false;
}

    r.players.forEach(p => { g += `<span class="lab">${esc(p.id === 'me' ? 'You' : p.name)}</span>` + ix.map(k => { const s = r.cards[p.id][k].s; return `<span class="s">${s != null ? mark(s, r.course.pars[k]) : '<i class="dash">–</i>'}</span>`; }).join(''); });
    const out = r.players.map(p => { const v = sum(ix.map(k => r.cards[p.id][k].s)); return v || '–'; });
    return `<div class="lv-nine"><div class="lv-h"><span>${name}</span><span>${lab} <b>${out.join(' · ')}</b></span></div><div class="lv-g" style="--n:${ix.length}">${g}</div></div>`; }).join('');

/* ---------- helpers ---------- */
const courseList = () => COURSES.map(c => S.prefs.fixed[c.id] ? {...c, pars:S.prefs.fixed[c.id]} : c).concat((S.prefs.custom || []));
const findCourse = id => courseList().find(c => c.id === id);
const live = () => S.rounds.find(r => r.status === 'live');
const done = () => S.rounds.filter(r => r.status === 'done').sort((a,b) => (a.date + a.createdAt).localeCompare(b.date + b.createdAt));
const card = (r, pid) => r.cards[pid];
function mark(n, par){
  const d = n - par, sw = 'stroke="currentColor" fill="none" stroke-width="2.6"';
  let shape = '';
  if (d <= -2) shape = `<circle cx="20" cy="20" r="18.5" ${sw}/><circle cx="20" cy="20" r="13.5" ${sw}/>`;
  else if (d === -1) shape = `<circle cx="20" cy="20" r="17.5" ${sw}/>`;
  else if (d === 1) shape = `<rect x="2.5" y="2.5" width="35" height="35" rx="2" ${sw}/>`;
  else if (d >= 2) shape = `<rect x="1.5" y="1.5" width="37" height="37" rx="2" ${sw}/><rect x="7" y="7" width="26" height="26" rx="1" ${sw}/>`;
  const c = d <= -2 ? 'm-under m-eagle' : d < 0 ? 'm-under' : d === 0 ? 'm-par' : d === 1 ? 'm-over' : 'm-worse';
  return `<span class="mk ${c}"><svg viewBox="0 0 40 40" aria-hidden="true">${shape}</svg><b>${n}</b></span>`;
}
const nameOf = (s, par) => { if (s === 1) return 'Ace'; const d = s - par; return d <= -3 ? 'Albatross' : d === -2 ? 'Eagle' : d === -1 ? 'Birdie' : d === 0 ? 'Par' : d === 1 ? 'Bogey' : d === 2 ? 'Double' : d === 3 ? 'Triple' : '+' + d; };
const LEGEND = `<div class="legend"><span>${mark(3,5)} eagle or better</span><span>${mark(3,4)} birdie</span><span>${mark(4,4)} par</span><span>${mark(5,4)} bogey</span><span>${mark(6,4)} double bogey or worse</span></div>`;
function totals(r, pid){
  const t = {shots:0, par:0, holes:0, putts:0, puttN:0, three:0, fwN:0, fwHit:0, gir:0, girN:0, pts:0};
  card(r, pid).forEach((h, i) => {
    if (h.s == null) return; const par = r.course.pars[i];
    t.holes++; t.shots += h.s; t.par += par;
    if (GAMES[r.game].pts) t.pts += GAMES[r.game].pts(h.s, par);
    if (h.p != null) { t.putts += h.p; t.puttN++; if (h.p >= 3) t.three++; t.girN++; if (h.s - h.p <= par - 2) t.gir++; }
    if (par > 3 && h.f) { t.fwN++; if (h.f === 'hit') t.fwHit++; }
  });
  t.over = t.shots - t.par;
  if (GAMES[r.game].round) t.pts = GAMES[r.game].round(r)[pid] || 0;
  return t;
}
function leaderboard(r){
  const rows = r.players.map(p => ({p, t:totals(r, p.id)}));
  rows.sort((a,b) => scored(r.game) ? b.t.pts - a.t.pts : a.t.over - b.t.over);
  return rows;
}

/* ---------- actions ---------- */
function newSetup(){
  const c = S.prefs.courseId && findCourse(S.prefs.courseId);
  return {course:c || null, players:[{id:'me', name:'You'}], game:S.prefs.game || 'stroke', date:today(), name:''};
}
function startRound(){
  const st = S.setup;
  if (!st.course) { S.screen = 'courses'; render(); toast('Pick a course first.'); return; }
  if (GAMES[st.game].min && st.players.length < GAMES[st.game].min) { toast(GAMES[st.game].name + ' needs at least ' + GAMES[st.game].min + ' players.'); return; }
  const r = {id:'r-' + newId(), kind:'rc-round', status:'live', date:st.date || today(), createdAt:new Date().toISOString(),
    course:{id:st.course.id, name:st.course.name, area:st.course.area || '', pars:st.course.pars.slice()},
    game:st.game, players:st.players.map(p => ({...p})), cards:{}, cur:0};
  r.players.forEach(p => r.cards[p.id] = r.course.pars.map(() => ({s:null, p:null, f:null})));
  S.rounds.push(r);

let SWX = null;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;

    case 'def-game': S.prefs.game = v; store.savePrefs(); render(); break;

    case 'theme': THEME = v; try { localStorage.setItem(TKEY, v); } catch(e) {} applyTheme(v); S.prefs.theme = v; store.savePrefs(); render(); break;
    case 'leave-hole': S.away = true; S.sheet = null; render(); scrollTo(0,0); break;
    case 'new': if (live()) { S.away = false; S.screen = null; render(); scrollTo(0,0); break; } S.setup = newSetup(); S.screen = 'setup'; render(); scrollTo(0,0); break;
    case 'cancel': S.setup = null; S.screen = null; render(); break;
    case 'courses': S.q = ''; S.screen = 'courses'; render(); scrollTo(0,0); break;
    case 'course': S.setup.course = findCourse(v); S.screen = 'setup'; render(); scrollTo(0,0); break;
    case 'game': st.game = v; render(); break;
    case 'friend': { const i = st.players.findIndex(p => p.name === v && p.id !== 'me'); if (i > 0) st.players.splice(i, 1); else if (st.players.length < 4) st.players.push({id:'f-' + newId(), name:v}); else toast('Up to 4 players.'); render(); break; }
    case 'add-friend': {
      const inp = document.getElementById('fname'), n = (inp && inp.value || '').trim().slice(0, 20);
      if (!n) { inp && inp.focus(); return; }
      if (st.players.length >= 4) { toast('Up to 4 players.'); return; }
      if (!st.players.some(p => p.name === n)) st.players.push({id:'f-' + newId(), name:n});
      render(); document.getElementById('fname')?.focus(); break;
    }
    case 'start': { const d = document.getElementById('date'); if (d && d.value) st.date = d.value; startRound(); break; }
    case 'hint': S.prefs.hint = true; store.savePrefs(); render(); break;

    case 's': {
      const h = hole(), wasEmpty = h.s == null; h.s = +v; if (h.p != null && h.p > h.s - 1) h.p = Math.max(0, h.s - 1);

    case 'step': { const h = hole(); h.s = Math.max(1, Math.min(15, (h.s ?? par()) + +v)); if (h.p != null && h.p > h.s - 1) h.p = Math.max(0, h.s - 1); store.saveRound(r); render(); break; }
    case 'p': { const h = hole(), wasEmpty = h.p == null; h.p = +v; store.saveRound(r); render(); if (r.players.length === 1 && wasEmpty && h.s != null && S.prefs.autoNext !== false) autoNext(r); break; }

    case 'hole': r.cur = +v; store.saveRound(r); render(); break;
    case 'prev': if (r.cur > 0) { r.cur--; store.saveRound(r); render(); scrollTo(0,0); } break;
    case 'next': if (r.cur < r.course.pars.length - 1) { r.cur++; store.saveRound(r); render(); scrollTo(0,0); } break;

    case 'all-rounds': S.allRounds = !S.allRounds; render(); break;
    case 'round': S.view = v; render(); scrollTo(0,0); break;

const LEVELS = [

  {from:80, goal:'break 80', putts:31, fw:.55, gir:9}, {from:0, goal:'shoot par', putts:29.5, fw:.62, gir:12}

function combine(list){
  const T = {shots:0, par:0, holes:0, putts:0, puttN:0, three:0, fwN:0, fwHit:0, gir:0, girN:0};
  list.forEach(r => { const t = totals(r, 'me'); for (const k in T) T[k] += t[k]; });

}
function estimate(courseId){

  const recent = rounds.slice(-5), by = {};
  recent.forEach(r => r.cards.me.forEach((h, i) => { const p = r.course.pars[i]; if (h.s == null) return; by[p] = by[p] || {n:0, d:0}; by[p].n++; by[p].d += h.s - p; }));
  const all = Object.values(by).reduce((a, x) => ({n:a.n + x.n, d:a.d + x.d}), {n:0, d:0});
  const formOver = p => by[p] && by[p].n >= 3 ? by[p].d / by[p].n : all.n ? all.d / all.n : 0;

    const form = par + formOver(par);
    return {i, par, n, avg:n ? sumS / n : null, est:n ? (n * (v / w) + 2 * form) / (n + 2) : form};

/* numbers behind the stats screen, shared by both designs */
function statsModel(list, days){
  const T = combine(list), L = LEVELS.find(l => T.avg >= l.from);
  const fulls = list.map(r => ({r, t:totals(r, 'me')})).filter(x => x.t.holes === 18);
  const bestX = fulls.length ? fulls.reduce((a, b) => b.t.shots < a.t.shots ? b : a) : null;
  const best = bestX ? {shots:bestX.t.shots, when:new Date(bestX.r.date + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'})} : null;
  const putts18 = T.puttN ? T.putts / T.puttN * 18 : null, gir18 = T.girN ? T.gir / T.girN * 18 : null, fw = T.fwN ? T.fwHit / T.fwN : null;
  const c = [0,0,0,0,0];
  list.forEach(r => r.cards.me.forEach((h, i) => { if (h.s == null) return; const d = h.s - r.course.pars[i]; c[d <= -2 ? 0 : d === -1 ? 1 : d === 0 ? 2 : d === 1 ? 3 : 4]++; }));
  const tot = c.reduce((a, b) => a + b, 0) || 1;
  const names = ['Eagle or better','Birdie','Par','Bogey','Double or worse'], cols = ['var(--sc-e-bar,#4F7FC4)','var(--sc-u-bar)','var(--sc-p-bar)','var(--sc-o-bar)','var(--sc-w-bar)'];
  const rows = c.map((x, k) => { const n = x / tot * 18, r = Math.round(n); return {name:names[k], col:cols[k], n, label:(n > 0 && r === 0 ? '<1' : r) + ' hole' + (r === 1 ? '' : 's')}; });
  const skills = [], areas = [];
  const st = (good, close) => good ? ['good', 'On target'] : close ? ['close', 'Close'] : ['work', 'Work on it'];
  if (putts18 != null && T.puttN >= 9) { const [state, stateText] = st(putts18 <= L.putts, putts18 <= L.putts + 1.5); skills.push({name:'Putting', state, stateText, vs:`You <b>${Math.round(putts18)}</b> putts · goal <b>${Math.round(L.putts)}</b> or fewer`}); areas.push({k:'Putting', lost:putts18 - L.putts, tip:'Practise long putts so the first one stops close.'}); }

}

function pxScene(){
  const night = isDark(), key = night ? 'n' : 'd';
  if (PXS[key]) return PXS[key];
  const W = 72, H = 40, P = night
    ? {sky1:'#17243C', skyM:'#1F304D', sky2:'#2A3D5E', sun:'#F4EFD2', sunE:'#D9D3AE', cloud:'#3A4E73', hill:'#2E4A47', trees:'#203833', trunk:'#3A2E28', f1:'#2F5E46', f2:'#346A4E', green:'#4B8A63', sand:'#8C8466', sandD:'#76704F', flag:'#E46A80', pole:'#E8ECEA', star:'#E8ECF6', shadow:'#244634'}
    : {sky1:'#A3D3EC', skyM:'#BCE0F1', sky2:'#D6EEF6', sun:'#FFF3C4', sunE:'#FFE38A', cloud:'#FFFFFF', hill:'#9ACBA9', trees:'#5E9C78', trunk:'#7A5A44', f1:'#7FC891', f2:'#8BD29C', green:'#B4E6BE', sand:'#F2E2AE', sandD:'#E0CB8C', flag:'#E5506B', pole:'#3B4744', star:null, shadow:'#69B07D'};
  let r = '';
  const dot = (x, y, c) => { r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${c}"/>`; };
  const ell = (cx, cy, rx, ry, c) => { for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) if (((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1) dot(x, y, c); };
  /* sky with a dithered fade toward the horizon */
  const band = y => y < 8 ? P.sky1 : y < 15 ? P.skyM : P.sky2;
  for (let y = 0; y < 22; y++) for (let x = 0; x < W; x++) dot(x, y, (y === 8 || y === 15) && (x % 2 === 0) ? band(y - 1) : band(y));
  if (night) [[6,3],[15,7],[27,2],[39,5],[48,9],[63,4],[68,10],[21,12],[33,9]].forEach(([x, y]) => dot(x, y, P.star));
  ell(58, 8, 4, 4, P.sunE); ell(58, 8, 3.2, 3.2, P.sun);
  if (night) { /* bite the sky back out of the disc: a crescent moon */
    for (let y = 3; y <= 12; y++) for (let x = 53; x <= 63; x++) {
      const inDisc = ((x + .5 - 58) / 4) ** 2 + ((y + .5 - 8) / 4) ** 2 <= 1;
      const inBite = ((x + .5 - 60.2) / 3.3) ** 2 + ((y + .5 - 6.6) / 3.3) ** 2 <= 1;
      if (inDisc && inBite) dot(x, y, (y === 8 || y === 15) && (x % 2 === 0) ? band(y - 1) : band(y));
    }
  }
  [[8,6],[30,10]].forEach(([x, y]) => { ell(x + 3, y + 1, 3, 1.6, P.cloud); ell(x + 6, y, 3, 2, P.cloud); ell(x + 9, y + 1, 2.5, 1.4, P.cloud); });
  /* rolling hills and tree line */
  for (let x = 0; x < W; x++) { const top = Math.round(17 + Math.sin(x / 7) * 1.6 + Math.sin(x / 3.1) * .6); for (let y = top; y < 23; y++) dot(x, y, P.hill); }
  for (let x = 0; x < W; x++) { const top = Math.round(20 + Math.abs(Math.sin(x * 1.3)) * 1.4 + (x % 5 === 0 ? -1 : 0)); for (let y = top; y < 24; y++) dot(x, y, P.trees); }
  /* fairway with mowing stripes */
  for (let y = 23; y < H; y++) for (let x = 0; x < W; x++) dot(x, y, Math.floor((x - (y - 23) * 1.4) / 6) % 2 === 0 ? P.f1 : P.f2);
  /* green, flag, bunker, tree */
  ell(55, 26, 9, 2.6, P.green);
  for (let y = 16; y < 26; y++) dot(55, y, P.pole);
  [[56,16],[57,16],[58,16],[59,16],[56,17],[57,17],[58,17],[59,17],[60,17],[56,18],[57,18],[58,18],[59,18]].forEach(([x, y]) => dot(x, y, P.flag));
  ell(41, 31, 5, 1.7, P.sandD); ell(41, 30.6, 4.4, 1.3, P.sand);
  for (let y = 22; y < 29; y++) { dot(66, y, P.trunk); }
  ell(66, 19, 4, 4.5, P.trees); ell(64.5, 17.5, 2, 2, P.hill);
  /* buddy on a tee */
  ell(16.5, 36.3, 5, 1, P.shadow);
  r += px(['.ww.','..w.','..w.'].map(row => row.replace(/w/g, 'T')), 15, 33, {T:night ? '#D9D2BE' : '#FFFFFF'});
  r += px(BUDDY, 10, 19);
  PXS[key] = `<svg viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" role="img" aria-label="Pixel golf ball buddy on a tee, looking down the fairway at the flag${night ? ' under a crescent moon' : ''}">${r}</svg>`;
  return PXS[key];
}

    <div class="sh-style" role="radiogroup" aria-label="Card style">${[['day','Day'],['night','Night'],['story','Story 9:16']].map(([k, l]) => `<button data-a="v3-sh-style" data-v="${k}" aria-pressed="${SHR.style === k}">${l}</button>`).join('')}</div>
    <input class="sh-cap" id="v3cap" placeholder="Add a caption…" value="${esc(SHR.cap)}" maxlength="80">
    <div class="sh-row"><button class="sh-t" data-a="v3-sh" data-v="save"><span>${shIco('save')}</span>Save image</button><button class="sh-t" data-a="v3-sh" data-v="msg"><span>${shIco('msg')}</span>Message</button><button class="sh-t" data-a="v3-sh" data-v="story"><span>${shIco('story')}</span>Story</button><button class="sh-t" data-a="v3-sh" data-v="link"><span>${shIco('link')}</span>Copy link</button></div></div>`;
}
/* draw the share card to a PNG (canvas), for saving and the share sheet */
async function shareImage(r, story){
  const d = shareData(r), night = SHR.style === 'night';
  const C = night ? {bg:'#1B1D20', card:'#212428', ink:'#E2DCD3', ink2:'#B3ACA3', gray:'#8C877F', line:'#383C41', label:'#D3CCC1', onlabel:'#161617'}
                  : {bg:'#ECE5E0', card:'#F7F3EE', ink:'#161617', ink2:'#5E574F', gray:'#968C81', line:'#DDD3C8', label:'#151516', onlabel:'#F7F3EE'};
  const SC = night ? {e:['#C6D3E0','#2F4A66'], u:['#A9C1D9','#25313D'], p:[C.line, C.card], o:['#E39A8F','#3F2724'], w:['#F0B4AA','#4E2622'], x:[C.line, C.card]}
                   : {e:['#2F4A66','#C6D3E0'], u:['#44617E','#E3E9EF'], p:[C.line, C.card], o:['#A6544B','#F3E3DE'], w:['#8A3A31','#E6C0B7'], x:[C.line, C.card]};
  try { await document.fonts.ready; } catch (e) {}
  const W = 1080, H = story ? 1920 : 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const cw = 900, ch = 1110, cx = (W - cw) / 2, cy = (H - ch) / 2;
  g.fillStyle = 'rgba(22,22,23,.16)'; g.fillRect(cx + 10, cy + 12, cw, ch); g.fillStyle = C.card; g.fillRect(cx, cy, cw, ch); g.strokeStyle = C.ink; g.lineWidth = 4; g.strokeRect(cx, cy, cw, ch);
  const PIX = '"DotGothic16", ui-monospace, monospace', SER = '"Cormorant Garamond", Georgia, serif', SAN = '"DM Sans", system-ui, sans-serif';
  // label
  g.font = `40px "Archivo Black", "Arial Black", sans-serif`; const lw = g.measureText('RITUALLY').width + 48;
  g.fillStyle = C.label; g.fillRect(cx + 48, cy + 48, lw, 70); g.fillStyle = C.onlabel; g.textBaseline = 'middle'; g.fillText('RITUALLY', cx + 72, cy + 85);
  g.font = `700 26px ${SER}`; g.fillStyle = C.gray; g.textAlign = 'right'; g.fillText('GOLF CLUB', cx + cw - 48, cy + 85); g.textAlign = 'left';
  // art
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SCENE3[night ? 'n' : 'd'].replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ').replace('viewBox="0 0 72 76"', 'viewBox="0 44 72 30"'));
  await new Promise(res => { img.onload = res; img.onerror = res; });
  if (!night) g.filter = 'sepia(.5) saturate(.62) brightness(1.03)';
  try { g.drawImage(img, cx + 48, cy + 150, cw - 96, 300); } catch (e) {} g.filter = 'none';
  g.strokeRect(cx + 48, cy + 150, cw - 96, 300);
  g.fillStyle = C.ink; g.font = `600 58px ${SER}`; g.textBaseline = 'alphabetic'; g.fillText(r.course.name, cx + 48, cy + 530, cw - 96);
  g.fillStyle = C.gray; g.font = `700 24px ${SER}`; g.fillText((d.date + ' · ' + d.game).toUpperCase(), cx + 48, cy + 572);
  g.fillStyle = C.ink; g.font = `190px ${PIX}`; g.fillText(String(d.t.shots), cx + 40, cy + 760); const sw = g.measureText(String(d.t.shots)).width;
  g.font = `52px ${PIX}`; g.fillText(toPar(d.t.over), cx + 70 + sw, cy + 650);
  g.fillStyle = C.ink2; g.font = `500 32px ${SAN}`; g.fillText(d.t.puttN ? d.t.putts + ' putts' : '', cx + 70 + sw, cy + 700); if (d.out) g.fillText(`Out ${d.out} · In ${d.inn}`, cx + 70 + sw, cy + 744);
  const cols = Math.min(9, d.cells.length), gw = cw - 96, cs = (gw - (cols - 1) * 8) / cols;
  d.cells.forEach(([k, val], i) => { const x = cx + 48 + (i % cols) * (cs + 8), y0 = cy + 800 + Math.floor(i / cols) * 86; const [stc, fil] = SC[k];
    g.fillStyle = fil; g.strokeStyle = stc; g.lineWidth = 4;
    if (k === 'u' || k === 'e') { g.beginPath(); g.arc(x + cs / 2, y0 + 38, 36, 0, 7); g.fill(); g.stroke(); } else { g.fillRect(x, y0, cs, 76); g.strokeRect(x + 2, y0 + 2, cs - 4, 72); if (k === 'w') g.strokeRect(x + 10, y0 + 10, cs - 20, 56); }
    g.fillStyle = k === 'p' || k === 'x' ? C.ink : stc; g.font = `40px ${PIX}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(val), x + cs / 2, y0 + 40); g.textAlign = 'left'; g.textBaseline = 'alphabetic'; });
  g.fillStyle = C.gray; g.font = `28px ${PIX}`; g.fillText('rituallyclub.com', cx + 48, cy + ch - 48);
  if (d.friends.length) { g.textAlign = 'right'; g.fillText('Played with ' + d.friends.join(', '), cx + cw - 48, cy + ch - 48); g.textAlign = 'left'; }
  if (SHR.cap) { g.fillStyle = C.ink; g.font = `italic 600 44px ${SER}`; g.textAlign = 'center'; g.fillText('“' + SHR.cap + '”', W / 2, cy - 60 > 60 ? cy - 60 : cy + ch + 80); g.textAlign = 'left'; }
  return new Promise(res => cv.toBlob(b => res(b), 'image/png'));
}
async function doShare(kind){
  const r = S.rounds.find(x => x.id === SHR.id); if (!r) return;
  const t = totals(r, 'me'), text = `${SHR.cap ? SHR.cap + ' · ' : ''}I shot ${t.shots} (${toPar(t.over)}) at ${r.course.name} · rituallyclub.com`;
  if (kind === 'link') { try { await navigator.clipboard.writeText(text); toast('Copied'); } catch (e) { toast(text); } return; }
  const blob = await shareImage(r, kind === 'story' || SHR.style === 'story'); if (!blob) { toast('Could not make the image'); return; }
  const file = new File([blob], `ritually-${r.date}.png`, {type:'image/png'});
  if (kind !== 'save' && navigator.canShare && navigator.canShare({files:[file]})) { try { await navigator.share({files:[file], text}); } catch (e) {} return; }
  if (kind === 'save' && navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad/.test(navigator.userAgent)) { try { await navigator.share({files:[file]}); } catch (e) {} return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(kind === 'save' ? 'Image saved' : 'Image saved · share it from your photos');
}
document.addEventListener('input', e => { if (e.target.id === 'v3cap') SHR.cap = e.target.value; });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a^="v3-"]'); if (!b) return; const a = b.dataset.a, v = b.dataset.v;
  e.stopPropagation();
  if (a === 'v3-tee') { S.prefs.tee = v; try { store.savePrefs(); } catch (er) {} render(); }
  else if (a === 'v3-share') { SHR.id = v; SHR.cap = ''; render(); $app.scrollTop = 0; }
  else if (a === 'v3-share-back') { SHR.id = null; render(); }
  else if (a === 'v3-sh-style') { SHR.style = v; render(); }
  else if (a === 'v3-sh') doShare(v);
  else if (a === 'v3-shop') { S.tab = 'shop'; SH.view = 'list'; render(); }
}, true);

render();
store.init().then(() => {
  if (S.prefs.theme && S.prefs.theme !== THEME) { THEME = S.prefs.theme; try { localStorage.setItem(TKEY, THEME); } catch(e) {} applyTheme(THEME); }
  S.ready = true; render();
});
if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); const f = () => { if (THEME === 'auto') applyTheme('auto'); }; mq.addEventListener ? mq.addEventListener('change', f) : mq.addListener && mq.addListener(f); }
})();

</script>
